// ---------- Start / Stop from Tracket ----------
// The button asks the server (POST /api/control); an Asana tab — told at once
// through the userscript relay on this page, else on its next beat — or the Mac
// menu bar presses Asana's own button. A plain Start uses the last logged ticket
// that isn't complete (GET /api/next).
let nextT = null;          // { gid, name, url } a plain Start would use
let ctlBusy = null;        // { action, at } while a command is on its way
let boostUntil = 0;        // poll every second until then
const SVG = (d) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${d}</svg>`;
const PLAY = SVG('<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/>');
const STOP = SVG('<rect x="5" y="5" width="14" height="14" rx="2.5"/>');
const SPIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
const POP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="12" width="7" height="6" rx="1" fill="currentColor"/></svg>';

async function loadNext(fresh){
  if (mode !== 'live') return;
  try { nextT = (await api('/api/next' + (fresh ? '?fresh=1' : ''))).next; } catch {}
  renderCtl(true);
}
function pendingManual(){ const a = live?.auto; return a && a.kind === 'manual' && (a.status === 'pending' || a.status === 'running') ? a : null; }

function renderCtl(force){
  const el = $('ctl');
  if (!el) return;
  if (!isTodayView() || (mode !== 'live' && mode !== 'demo')) { el.innerHTML = ''; el.dataset.h = ''; return; }
  const r = runningNow();
  const pend = pendingManual();
  if (ctlBusy && !pend && Date.now() - ctlBusy.at > 4000) ctlBusy = null;
  const busy = pend || ctlBusy;
  const next = mode === 'demo' ? { name: 'Checkout › coupon totals round the wrong way' } : nextT;
  let html;
  if (busy) {
    const what = (pend?.action || ctlBusy?.action) === 'stop' ? 'Stopping…' : pend?.action === 'switch' ? 'Switching…' : 'Starting…';
    html = `<button class="go busy ${r ? 'stop' : ''}" disabled><span class="k">${SPIN}</span><span class="l">${what}<small>${hbOn() ? 'In your Asana tab' : 'Waiting for an Asana tab'}</small></span></button>`;
  } else if (r) {
    html = `<button class="go stop" data-ctl="stop" title="Stop the timer (S)"><span class="k">${STOP}</span><span class="l">Stop<small>${esc(r.taskName || 'the timer')}</small></span></button>`;
  } else {
    html = `<button class="go" data-ctl="start" ${next ? '' : 'disabled'} title="${next ? 'Start the timer on your last open ticket (S)' : 'Start a timer in Asana once — Tracket remembers it'}"><span class="k">${PLAY}</span><span class="l">Start<small>${next ? esc(next.name) : 'no recent ticket'}</small></span></button>`;
  }
  html += `<button class="pop" data-pop title="Pop out a mini timer (P)" aria-label="Pop out a mini timer">${POP}</button>`;
  if (!force && el.dataset.h === html) return;
  el.dataset.h = html; el.innerHTML = html;
  el.querySelector('[data-ctl]')?.addEventListener('click', (e) => control(e.currentTarget.dataset.ctl));
  el.querySelector('[data-pop]').onclick = popOut;
}

async function control(action, gid){
  if (mode !== 'live') return openLogin();
  if (ctlBusy || pendingManual()) return;
  ctlBusy = { action, at: Date.now() }; renderCtl();
  try {
    const rec = await api('/api/control', { json: { action, gid } });
    live = { ...live, auto: rec };
    relayAuto(rec);
    if (!hbOn()) toast('No Asana tab is reporting — open Asana so Tracket can press the button');
    boostUntil = Date.now() + 25000;
    poll();
  } catch (x) { toast(x.message); }
  ctlBusy = null; renderCtl();
}

// Hand any pending action to the userscript on this page, which passes it to
// the Asana tabs instantly (see the top of tracket.user.js).
function relayAuto(a){
  const de = document.documentElement;
  if (a && a.status === 'pending') { const v = JSON.stringify(a); if (de.getAttribute('data-tracket-action') !== v) de.setAttribute('data-tracket-action', v); }
}

// ---------- pop-out mini timer ----------
// Chrome/Brave/Edge: a real always-on-top window (Document Picture-in-Picture)
// with Start/Stop. Safari/Firefox: the video picture-in-picture trick.
let pip = null;
async function popOut(){
  if (pip) { try { pip.close(); } catch {} pip = null; return; }
  if ('documentPictureInPicture' in window) {
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 320, height: 150 });
      pip = { close: () => w.close(), render: () => renderPip(w.document) };
      const d = w.document;
      [...document.querySelectorAll('link[rel=stylesheet],style')].forEach((n) => d.head.appendChild(n.cloneNode(true)));
      if (document.documentElement.dataset.theme) d.documentElement.dataset.theme = document.documentElement.dataset.theme;
      d.head.insertAdjacentHTML('beforeend', `<style>body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
        .m{display:flex;align-items:center;gap:12px}.m .t{flex:1;min-width:0}.m .n{font:800 34px/1 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
        .m .s{font:500 12px/1.3 var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.m .s.on{color:var(--rec)}
        .m button{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--amber);color:var(--on-accent);cursor:pointer}
        .m button.stop{background:var(--rec);color:#fff}.m button svg{width:20px;height:20px}.m button[disabled]{opacity:.5}</style>`);
      d.body.innerHTML = '<div class="m"><div class="t"><div class="n" id="pn">0:00:00</div><div class="s" id="ps"></div></div><button id="pb"></button></div>';
      d.getElementById('pb').onclick = () => { const r = runningNow(); control(r ? 'stop' : 'start'); };
      w.addEventListener('pagehide', () => { pip = null; });
      renderPip(d);
      return;
    } catch (x) { /* fall back to video */ }
  }
  try {
    const c = document.createElement('canvas'); c.width = 480; c.height = 180;
    const v = document.createElement('video'); v.muted = true; v.playsInline = true;
    v.srcObject = c.captureStream(2);
    pip = { close: () => document.exitPictureInPicture?.().catch(() => {}), render: () => drawPip(c) };
    drawPip(c);
    await v.play();
    await v.requestPictureInPicture();
    v.addEventListener('leavepictureinpicture', () => { pip = null; v.srcObject = null; });
  } catch (x) { pip = null; toast('This browser can’t pop out a window. Try Chrome, Brave, Edge or Safari.'); }
}
function pipState(){
  const { total } = totals(); const r = runningNow();
  return { total, r, line: r ? `● ${r.taskName || 'Running'}` : 'Nothing ticking' };
}
function renderPip(d){

function openCmd(q = '', help = false){
  closeCmd(); closeModal();
  const box = document.createElement('div');
  box.className = 'cmdk'; box.id = 'cmdk';
  box.innerHTML = `<div class="box" role="dialog" aria-label="Command bar"><input placeholder="${help ? 'Keyboard shortcuts' : 'Type a command… (start, theme, history, settings)'}" aria-label="Command"><ul role="listbox"></ul>
    <div class="foot"><span>↑↓ choose</span><span>↵ run</span><span>esc close</span><span style="margin-left:auto">⌘K / Ctrl K</span></div></div>`;
  document.body.appendChild(box);
  const input = box.querySelector('input'), ul = box.querySelector('ul');
  let all = commands(), sel = 0, shown = [];
  if (help) all = all.filter((c) => c.k);
  const draw = () => {
    const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    shown = all.filter((c) => words.every((w) => c.t.toLowerCase().includes(w))).slice(0, 40);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    ul.innerHTML = shown.map((c, i) => `<li role="option" class="${i === sel ? 'on' : ''}" data-i="${i}">${ic(c.i)}<b>${esc(c.t)}</b>${c.k ? `<kbd>${c.k}</kbd>` : ''}</li>`).join('') || '<li><b>No match</b></li>';
    ul.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
  };
  const run = (i) => { const c = shown[i]; if (!c) return; closeCmd(); c.run(); };
  input.value = q; draw(); setTimeout(() => input.focus(), 20);
  input.oninput = () => { sel = 0; draw(); };
  input.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { run(sel); e.preventDefault(); }
    else if (e.key === 'Escape') { closeCmd(); e.preventDefault(); }
  };
  ul.onclick = (e) => { const li = e.target.closest('[data-i]'); if (li) run(+li.dataset.i); };
  box.addEventListener('mousedown', (e) => { if (e.target === box) closeCmd(); });
}

function startTour(){
  closeModal(); closeCmd(); document.querySelector('.tour')?.remove();
  const steps = TOUR.filter((s) => { const el = document.querySelector(s.el); return el && el.offsetParent !== null && !el.hidden; });
  if (!steps.length) return;
  const wrap = document.createElement('div'); wrap.className = 'tour';
  wrap.innerHTML = '<div class="hole"></div><div class="tip" role="dialog" aria-live="polite"></div>';
  document.body.appendChild(wrap);
  const hole = wrap.querySelector('.hole'), tip = wrap.querySelector('.tip');
  let i = 0;
  const end = () => { wrap.remove(); setLS('tk_tour', '1'); removeEventListener('keydown', key); removeEventListener('resize', place); };
  const key = (e) => { if (e.key === 'Escape') end(); else if (e.key === 'ArrowRight' || e.key === 'Enter') go(i + 1); else if (e.key === 'ArrowLeft') go(i - 1); };
  function place(){
    const el = document.querySelector(steps[i].el); const r = el.getBoundingClientRect(), pad = 8;
    Object.assign(hole.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });
    const below = r.bottom + 14 + 170 < innerHeight;
    tip.style.top = `${below ? r.bottom + 14 : Math.max(12, r.top - 14 - tip.offsetHeight)}px`;
    tip.style.left = `${Math.max(16, Math.min(innerWidth - tip.offsetWidth - 16, r.left))}px`;
  }
  function go(n){
    if (n < 0) return; if (n >= steps.length) return end();
    i = n;
    const s = steps[i];
    document.querySelector(s.el).scrollIntoView({ block: 'center', behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
    tip.innerHTML = `<b>${s.t}</b><p>${s.p}</p><div class="acts"><span>${i + 1} / ${steps.length}</span><button class="btn ghost" data-skip>Skip</button>${i ? '<button class="btn ghost" data-back>Back</button>' : ''}<button class="btn" data-next>${i === steps.length - 1 ? 'Done' : 'Next'}</button></div>`;
    tip.querySelector('[data-skip]').onclick = end;
    tip.querySelector('[data-back]')?.addEventListener('click', () => go(i - 1));
    tip.querySelector('[data-next]').onclick = () => go(i + 1);
    requestAnimationFrame(place);
  }
  addEventListener('keydown', key); addEventListener('resize', place);
  go(0);
}

async function removeLunch(gid, btn){
  const t = (data?.tasks || []).find((x) => x.gid === gid);
  const entries = (t?.entries || []).filter((e) => e.lunchMin > 0 && e.gid);
  if (!entries.length) return;

  if (!confirm(`Remove ${hm(mins * 60)} of lunch from “${t.name}”?\n\nThis edits your logged time in Asana.`)) return;

  load(true);
}

  shift = meInfo.shift || null;
  if (meInfo.prefs?.theme && meInfo.prefs.theme !== TT.choice()) TT.apply(meInfo.prefs.theme);
  if (meInfo.role === 'member') {
    if (meInfo.asana) { enterLive(); loadNext(); if (!getLS('tk_tour')) setTimeout(() => { if (mode === 'live' && !$('modal')) startTour(); }, 2500); }
    else enterConnect();
    await checkPush();
    pollAlerts();
  }
  else enterDemo();
}

// A believable fake day: a few tickets and a timer that started 23 minutes ago.
function loadDemo(){
  const t0 = Date.now();
  const mk = (gid, name, mins) => ({ gid, name, url: null, minutes: mins.reduce((a, b) => a + b, 0),
    entries: mins.map((m, i) => ({ minutes: m, createdAt: new Date(t0 - (6 - i) * 3600e3).toISOString() })) });
  const demoDay = { date: ymd(new Date()), today: ymd(new Date()), user: { name: 'Guest' }, lunch: DEMO_PREFS.lunch, lunchMinutes: 25,
    tasks: [
      mk('d1', 'Checkout › coupon totals round the wrong way', [74, 58]),
      { ...mk('d2', 'Onboarding › redesign the welcome screens', [66]), comment: false, lunchMin: 25 },
      { ...mk('d3', 'API › rate-limit the export endpoint', [41, 22]), check: { ok: false, reasons: ['Task Status is “India QC Feedback”'] } },
      mk('d4', 'Standup & sprint planning', [30]),
    ] };
  todayStr = demoDay.today;
  if (viewDay) { // past days in the demo: same shape, different numbers
    demoDay.tasks = demoDay.tasks.map((t, i) => ({ ...t, minutes: Math.round(t.minutes * (0.6 + ((viewDay.charCodeAt(9) + i) % 5) / 6)) }));
  }
  data = demoDay;
  live = viewDay ? { running: null, lastHeartbeat: Date.now() }
    : { running: { taskGid: 'd5', taskName: 'Search › results flicker while typing', url: null, startedAt: (loadDemo.start ||= t0 - 23 * 60e3 - 17e3) }, lastHeartbeat: Date.now() };
  live.lastHeartbeat = Date.now();
  clockSkew = 0;
  $('synced').textContent = 'Demo data';
  header();
  renderStatic();
}

$('gear').onclick = () => openSettings();
$('themeBtn').onclick = openThemes;
$('bell').onclick = openAlerts;
$('loginBtn').onclick = openLogin;

buildOdo();
try { const q = new URLSearchParams(location.search).get('date'); if (/^\d{4}-\d{2}-\d{2}$/.test(q || '') && q < ymd(new Date())) viewDay = q; } catch {}
header();
$('prev').onclick = () => shiftDay(-1);
$('next').onclick = () => shiftDay(1);
$('goToday').onclick = () => setDay(null);
// Chromium (Brave, Chrome, Edge) only opens the picker from its calendar icon,
// which is invisible here — open it explicitly on any click.
$('pick').addEventListener('click', (e) => { try { e.preventDefault(); e.target.showPicker(); } catch {} });
$('pick').onchange = (e) => { const v = e.target.value; if (v) setDay(v >= (todayStr || ymd(new Date())) ? null : v); };
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') shiftDay(-1);
  else if (e.key === 'ArrowRight') shiftDay(1);
  else if (e.key.toLowerCase() === 't') setDay(null);
});
// Auto-refresh: live timer via polling; finished entries when Asana changes,
// when the tab comes back into view, and when the internet returns.
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
addEventListener('online', () => { tick(); load(true); });
addEventListener('offline', tick);
// Background tabs get their timers throttled; a worker's timer isn't, so the
// tab title keeps ticking while you're on other sites.
try {
  const w = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 1000)'], { type: 'text/javascript' })));
  let n = 0;
  w.onmessage = () => { tick(); if (pollDue()) poll(); };
} catch { setInterval(tick, 1000); setInterval(() => { if (pollDue()) poll(); }, 1000); }
addEventListener('focus', () => poll());
setInterval(() => { if (mode === 'live' && isTodayView() && !document.hidden) load(false); }, 5 * 60 * 1000); // backup
renderOffline();
boot();
</script>
