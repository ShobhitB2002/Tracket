<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Tracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='17' r='12' fill='%23ffb547'/><rect x='14' y='1' width='4' height='5' rx='1' fill='%23ffb547'/><path d='M16 17V9' stroke='%230b0b10' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#0b0b10; --bg2:#12121a; --card:#16161f; --card2:#1c1c28; --line:#262635;
  --ink:#f3efe6; --mute:#8a879a; --dim:#55536a;
  --amber:#ffb547; --mint:#5cf2b0; --rec:#ff4d6d; --violet:#a78bfa;
  --r:22px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ambient backdrop: slow drifting glow + film grain */
.sky{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 15%, #ffb54722, transparent 70%),
    radial-gradient(35% 30% at 85% 30%, #a78bfa1f, transparent 70%),
    radial-gradient(45% 40% at 60% 95%, #5cf2b014, transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(4deg)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:28px 20px 80px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--amber),#ff7a45);color:var(--bg);font-weight:800;font-size:20px;
  box-shadow:0 8px 30px -8px #ffb54788;transform:rotate(-6deg)}
.hello{flex:1;min-width:0}
.hello .brand{display:block;font:800 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;margin-bottom:5px;
  background:linear-gradient(90deg,var(--amber),#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.hello span{font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:8px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:#ffffff05}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.on i{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.pill.on{color:var(--ink)}
.pill.off i{background:var(--rec);box-shadow:0 0 10px var(--rec)}
.days{display:flex;align-items:center;gap:6px;margin:-14px 0 18px}
.days button,.days label{height:36px;min-width:36px;padding:0 12px;border-radius:12px;display:inline-grid;place-items:center;
  background:var(--card);border:1px solid var(--line);font:600 12px/1 var(--mono);color:var(--mute);cursor:pointer;
  transition:transform .2s,border-color .2s,color .2s,background .2s;position:relative}
.days button:hover,.days label:hover{border-color:var(--amber);color:var(--ink);background:var(--card2)}
.days button:active,.days label:active{transform:scale(.94)}
.days button:disabled{opacity:.3;pointer-events:none}
.days label{flex:1;max-width:260px;color:var(--ink)}
.days input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.days .today{color:var(--amber);border-color:#ffb54755}
.days .today[hidden]{display:none}

/* ---------- hero total ---------- */
.hero{position:relative;padding:34px 30px 28px;border-radius:32px;overflow:hidden;
  background:linear-gradient(160deg,#1b1b27 0%,#121219 70%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 38px)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}
.eyebrow .live{color:var(--rec);display:none}
.hero.ticking .eyebrow .live{display:inline-flex;align-items:center;gap:6px}
.eyebrow .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

.odo{display:flex;align-items:flex-end;margin:16px 0 6px;font:800 clamp(64px,15vw,132px)/1 var(--mono);letter-spacing:-.06em;
  font-variant-numeric:tabular-nums}
.digit{position:relative;display:inline-block;height:1em;width:.62em;overflow:hidden}
.digit .reel{position:absolute;left:0;top:0;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.25,.9,.3,1)}
.digit .reel span{height:1em;display:block;text-align:center}
.sep{width:.42em;text-align:center;color:var(--dim);transform:translateY(-.06em);margin-left:-.04em}
.odo .sec{font-size:.42em;color:var(--mute);margin-left:.18em;align-self:flex-end;transform:translateY(-.16em);display:flex}
.odo .sec .digit{width:.62em}
.hero.ticking .odo{filter:drop-shadow(0 0 28px #ffb54740)}
.odo .sec .reel{transition-duration:.3s}

.goal{display:flex;justify-content:space-between;font:400 12px/1 var(--mono);color:var(--mute);margin:18px 0 10px}
.goal b{color:var(--ink);font-weight:600}
.tape{position:relative}
.tape .min{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.35;border-radius:2px;pointer-events:none}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0;padding:10px 14px;border-radius:14px;font:500 13px/1.45 var(--sans,inherit);border:1px solid var(--line);background:var(--card)}
.verdict[hidden]{display:none}
.shift{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#ffffff05;font-size:13px;line-height:1.45;color:var(--mute)}
.shift .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shift b{color:var(--ink);font-weight:600}
.shift .score{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;font:800 18px/1 var(--mono)}
.shift .score small{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.shift .good{color:var(--mint)} .shift .mid{color:var(--amber)} .shift .bad{color:var(--rec)}
.shift .sbar{position:relative;height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.shift .sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--violet);border-radius:6px}
.shift .sub{margin-top:8px;font-size:12px}
.shift button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:5px 10px;font:600 11px/1 var(--mono);cursor:pointer}
.shift button:hover{border-color:var(--amber)}
.srows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:78px 1fr auto 1fr;gap:8px;align-items:center}
.srow label{display:flex;gap:8px;align-items:center;font:600 13px var(--mono);cursor:pointer}
.srow input[type=time]{min-width:0;border-radius:10px;border:1px solid var(--line);background:#0c0c12;color:var(--ink);padding:8px 10px;font:400 14px var(--mono);color-scheme:dark}
.srow.off input[type=time],.srow.off span{opacity:.3;pointer-events:none}
@media (max-width:480px){
  .srow{grid-template-columns:56px 1fr auto 1fr;gap:6px}
  .srow input[type=time]{padding:8px 6px;font-size:13px}
  .srow input[type=time]::-webkit-calendar-picker-indicator{display:none} /* phones open their own picker on tap */
}
.verdict.low{border-color:#ff4d6d55;color:#ff9aac}
.verdict.ok{border-color:#ffb54755;color:var(--amber)}
.verdict.over{border-color:#4ade8055;color:#86efac}
.verdict button{margin-left:auto;background:none;border:1px solid currentColor;color:inherit;border-radius:10px;padding:4px 10px;font:600 11px/1 var(--mono);cursor:pointer}
.tape{position:relative;height:14px;border-radius:99px;background:#0c0c12;border:1px solid var(--line);overflow:hidden;display:flex}
.tape .seg{height:100%;transition:width .8s cubic-bezier(.2,.9,.3,1);position:relative}
.tape .seg + .seg{box-shadow:inset 2px 0 0 #0c0c12}
.tape .seg.run{background-image:repeating-linear-gradient(-45deg,#ffffff33 0 6px,transparent 6px 12px)!important;animation:stripes 1s linear infinite;background-size:17px 17px}
@keyframes stripes{to{background-position:17px 0}}
.ticks{display:flex;justify-content:space-between;font:400 10px/1 var(--mono);color:var(--dim);margin-top:8px;padding:0 1px}

/* ---------- sections ---------- */
h2{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:40px 4px 14px;display:flex;align-items:center;gap:10px}
h2 .count{color:var(--dim)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* on-air card */
.onair{position:relative;border-radius:var(--r);padding:22px 22px 20px;overflow:hidden;
  background:linear-gradient(135deg,#2a1420,#171320 55%);border:1px solid #ff4d6d44;
  box-shadow:0 20px 60px -30px #ff4d6d88}
.onair::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(#ff4d6d55,transparent 70%);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.6}}
.onair .row{position:relative;display:flex;align-items:center;gap:18px}
.recdot{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#ff4d6d1f;border:1px solid #ff4d6d55}
.recdot i{width:18px;height:18px;border-radius:50%;background:var(--rec);box-shadow:0 0 20px var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);box-shadow:0 0 6px var(--rec)}}
.onair .meta{flex:1;min-width:0}
.tag{font:800 10px/1 var(--mono);letter-spacing:.2em;color:var(--rec);display:block;margin-bottom:8px}
.onair .name{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.onair .name:hover{text-decoration:underline;text-decoration-color:#ff4d6d88;text-underline-offset:4px}
.onair .clock{font:800 34px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.onair .since{position:relative;font:400 12px/1 var(--mono);color:var(--mute);margin-top:14px;display:flex;justify-content:space-between;gap:10px}
.onair .since button{color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.onair .since button:hover{color:var(--ink)}

.idle{border-radius:var(--r);padding:22px;border:1px dashed var(--line);color:var(--mute);display:flex;gap:16px;align-items:center;font-size:15px}
.idle .z{font:800 22px/1 var(--mono);color:var(--dim);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-8deg)}}
.idle small{display:block;color:var(--dim);font:400 12px/1.5 var(--mono);margin-top:4px}

/* ticket list */
.list{display:grid;gap:10px}
.tk{--c:var(--amber);position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:16px 18px 16px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .2s,background .2s;opacity:0;animation:rise .5s cubic-bezier(.2,1,.3,1) forwards}
.tk:hover{transform:translateY(-2px) rotate(-.25deg);border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:var(--card2)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rank{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 14px/1 var(--mono);
  color:var(--bg);background:var(--c);box-shadow:0 6px 20px -8px var(--c)}
.tk .body{min-width:0}
.tk .title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tk .sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.bar{flex:1;height:5px;border-radius:9px;background:#0c0c12;overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.chips{display:flex;gap:4px}
.chips b{width:6px;height:6px;border-radius:2px;background:color-mix(in srgb,var(--c) 70%,transparent)}
.pct{font:400 11px/1 var(--mono);color:var(--dim)}
.dur{font:800 20px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-align:right}
.dur small{display:block;font:400 11px/1 var(--mono);color:var(--dim);margin-top:6px;letter-spacing:0}
.tk.live{border-color:#ff4d6d55}
.tk.live .dur{color:var(--rec)}

.empty{text-align:center;padding:50px 20px;border-radius:var(--r);border:1px dashed var(--line);color:var(--mute)}
.empty .big{font-size:44px;display:block;margin-bottom:12px;filter:grayscale(.2)}
.empty p{font:400 13px/1.6 var(--mono);color:var(--dim);margin-top:6px}

.err{margin-top:18px;padding:14px 16px;border-radius:14px;background:#ff4d6d14;border:1px solid #ff4d6d44;color:#ffb3c1;font:400 13px/1.5 var(--mono);display:none}
.err.show{display:block}

footer{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:400 11px/1.4 var(--mono);color:var(--dim)}
kbd{font:600 10px/1 var(--mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mute)}

.toast{position:fixed;left:50%;bottom:30px;z-index:10;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;
  padding:12px 18px;border-radius:99px;background:var(--amber);color:var(--bg);font:800 14px/1 var(--mono);
  box-shadow:0 12px 40px -10px #ffb547aa;transition:all .5s cubic-bezier(.2,1.5,.4,1)}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}

.skel{height:70px;border-radius:18px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- modals, forms, banner ---------- */
.btn{height:44px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--amber);color:var(--bg);font-weight:800;font-size:15px;transition:transform .15s,filter .2s;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--amber)}
.btn.danger{background:transparent;color:var(--rec);border:1px solid #ff4d6d55;font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mute);transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--amber);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}

.intro{margin:-6px 0 22px}
.intro h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
.intro h1 em{font-style:normal;background:linear-gradient(90deg,var(--amber),#ff7a45 60%,var(--rec));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin-top:10px;color:var(--mute);font-size:16px;line-height:1.5;max-width:520px}
.banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:-10px 0 26px;padding:18px 20px;border-radius:22px;
  background:linear-gradient(120deg,#2a2112,#171320 60%);border:1px solid #ffb54744}
.banner .txt{flex:1;min-width:220px}
.banner b{display:block;font-size:17px;margin-bottom:4px}
.banner span{color:var(--mute);font-size:14px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.demo-tag{position:fixed;top:14px;right:-38px;z-index:5;transform:rotate(45deg);background:var(--amber);color:var(--bg);font:800 10px/1 var(--mono);letter-spacing:.2em;padding:6px 44px;pointer-events:none}

.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:#07070bcc;backdrop-filter:blur(10px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:28px 24px 24px;border-radius:26px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 30px 80px -30px #000;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.sheet.wide{max-width:560px}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.sheet h3{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.sheet p.lead{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:18px}
.sheet .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;color:var(--mute);font-size:20px}
.sheet .x:hover{background:var(--card2);color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field input,.field textarea{width:100%;border-radius:13px;border:1px solid var(--line);background:#0c0c12;color:var(--ink);padding:12px 14px;font:400 15px var(--sans);outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--amber)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.formerr{color:#ffb3c1;font:400 13px/1.4 var(--mono);min-height:18px;margin:4px 0 10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:44px;display:block;margin-bottom:10px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:34px;color:var(--mute);font-size:14px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:7px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font:800 11px/1 var(--mono);color:var(--amber)}
.steps b{color:var(--ink);font-weight:600}
.steps a,.lead a,.sec a{color:var(--amber)}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h4{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec .status{font:600 12px var(--mono);color:var(--mint)}
.sec .status.off{color:var(--rec)}
.sec p{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:12px}
details.how{margin-top:12px;color:var(--mute);font-size:14px}
details.how summary{cursor:pointer;color:var(--ink);font-weight:600}
details.how ol{margin:10px 0 0;padding-left:20px;line-height:1.6}
.seg-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.seg-tabs button{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0c0c12;color:var(--mute);font:600 12px var(--mono)}
.seg-tabs button.on{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.steps a.btn,.sec a.btn{color:var(--bg)}
.sec a.btn.ghost{color:var(--ink)}
.btn.sm-inline{height:30px;padding:0 12px;border-radius:9px;font-size:13px;vertical-align:middle}
.steps small{display:block;margin-top:8px;color:var(--dim);font-size:13px;line-height:1.9}
.note-open{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#ffb54710;border:1px solid #ffb54733;color:var(--mute);font-size:13px;line-height:1.55}
.note-open b{color:var(--ink)}
.waiting{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#0c0c12;border:1px dashed var(--line);color:var(--mute);font-size:14px}
.waiting i{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:blink 1.2s infinite;flex:none}
.waiting.done{border-style:solid;border-color:#5cf2b055;color:var(--ink)}
.waiting.done i{background:var(--mint);box-shadow:0 0 10px var(--mint);animation:none}
code{font:400 12px var(--mono);background:#0c0c12;border:1px solid var(--line);padding:2px 6px;border-radius:6px}
@media (max-width:560px){
  .wrap{padding:20px 16px 60px}
  .hero{padding:26px 20px 22px;border-radius:26px}
  .pill{display:none}
  .onair .row{flex-wrap:wrap}
  .onair .clock{font-size:28px;width:100%;padding-left:72px;margin-top:-4px}
  .tk{gap:12px;padding:14px}
  .tk .title{white-space:normal;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  .dur{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky"></div><div class="grain"></div>

<main class="wrap">
  <header class="top">
    <div class="logo">◔</div>
    <div class="hello"><span class="brand">Tracket</span><b id="greet">Hello</b><span id="date">—</span></div>
    <span class="pill" id="link" title="Userscript connection"><i></i><span id="linkText">Asana link</span></span>
    <button class="btn ghost" id="loginBtn" hidden>Log in</button>
    <button class="iconbtn" id="gear" title="Settings" aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="bannerSlot"></div>

  <nav class="days">
    <button id="prev" title="Previous day (←)" aria-label="Previous day">‹</button>
    <label title="Pick a date"><span id="dayLabel">Today</span><input type="date" id="pick"></label>
    <button id="next" title="Next day (→)" aria-label="Next day">›</button>
    <button class="today" id="goToday" hidden>Today</button>
  </nav>

  <section class="hero" id="hero">
    <div class="eyebrow"><span id="eyebrow">Logged today</span> <span class="live">live</span></div>
    <div class="odo" id="odo" aria-live="polite"></div>
    <div class="goal"><span id="goalText">of an 8h day</span><b id="goalPct">0%</b></div>
    <div class="tape" id="tape"></div>
    <div class="ticks"><span>0h</span><span>2h</span><span>4h</span><span>6h</span><span>8h</span></div>
    <div class="verdict" id="verdict" hidden></div>
    <div class="shift" id="shift" hidden></div>
  </section>

  <div id="onairWrap"><h2>On air</h2>
  <div id="running"></div></div>

  <h2><span id="listTitle">Today's tickets</span> <span class="count" id="count"></span></h2>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
  <div class="err" id="err"></div>

  <footer>
    <span id="synced">Not synced yet</span>
    <span><kbd>←</kbd> <kbd>→</kbd> change day · <kbd>T</kbd> today</span>
  </footer>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const PALETTE = ['#ffb547','#5cf2b0','#a78bfa','#5cc8ff','#ff8fab','#f5e663','#ff7a45','#7ee081'];
const GOAL_MIN = 8 * 60;
const MIN_DAY_MIN = 7 * 60; // below this the day doesn't count as a full one

let data = null;       // /api/today
let live = null;       // SSE running payload
let clockSkew = 0;     // serverNow - Date.now()
let lastHourShown = null;
let viewDay = null;    // YYYY-MM-DD being shown; null = today
let todayStr = null;   // server's today
const isTodayView = () => !viewDay || viewDay === todayStr;

// ---------- helpers ----------
const pad = (n) => String(n).padStart(2, '0');
// Colours follow the order tickets were first worked on today, so they never
// collide (for the first 8) and don't reshuffle when ranking changes.
const colorOrder = [];
const colorFor = (gid) => { let i = colorOrder.indexOf(gid); if (i < 0) i = colorOrder.push(gid) - 1; return PALETTE[i % PALETTE.length]; };
function assignColors(tasks){
  const first = (t) => Math.min(...(t.entries || []).map((e) => Date.parse(e.createdAt) - e.minutes * 60000), t.live ? runningNow().startedAt : Infinity);
  [...tasks].sort((a, b) => first(a) - first(b)).forEach((t) => colorFor(t.gid));
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function hm(sec){ const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60); return h ? `${h}h ${pad(m)}m` : `${m}m`; }
function hms(sec){ sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; }
const now = () => Date.now() + clockSkew;

function runningNow(){
  const r = isTodayView() ? live?.running : null;
  if (!r) return null;
  return { ...r, sec: (now() - r.startedAt) / 1000 };
}

// ---------- odometer ----------
function buildOdo(){
  const mk = () => `<span class="digit"><span class="reel">${[...Array(10)].map((_,i)=>`<span>${i}</span>`).join('')}</span></span>`;
  $('odo').innerHTML = `${mk()}${mk()}<span class="sep">:</span>${mk()}${mk()}<span class="sec">${mk()}${mk()}</span>`;
}
function setOdo(totalSec){
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.min(99, Math.floor(totalSec / 3600)), m = Math.floor(totalSec % 3600 / 60), s = totalSec % 60;
  const digits = `${pad(h)}${pad(m)}${pad(s)}`;
  document.querySelectorAll('#odo .reel').forEach((reel, i) => {
    const d = +digits[i];
    if (reel.dataset.d !== String(d)) { reel.dataset.d = d; reel.style.transform = `translateY(${-d}em)`; }
  });
}

// ---------- render ----------
function totals(){
  const tasks = (data?.tasks || []).map((t) => ({ ...t, sec: t.minutes * 60 }));
  const r = runningNow();
  if (r) {
    const hit = tasks.find((t) => t.gid === r.taskGid) || tasks.find((t) => r.taskGid.startsWith('name:') && t.name.trim() === r.taskName);
    if (hit) { hit.sec += r.sec; hit.live = true; }
    else tasks.push({ gid: r.taskGid, name: r.taskName, url: r.url, minutes: 0, sec: r.sec, entries: [], live: true, fresh: true });
  }
  tasks.sort((a, b) => b.sec - a.sec);
  return { tasks, total: tasks.reduce((s, t) => s + t.sec, 0), r };
}

function renderStatic(){
  const { tasks, total } = totals();
  assignColors(tasks);
  $('count').textContent = tasks.length ? `· ${tasks.length}` : '';
  if (!tasks.length) {
    $('list').innerHTML = isTodayView()
      ? `<div class="empty"><span class="big">🌙</span>Clean slate.<p>Start a timer on any Asana ticket —<br>it'll land here the moment it ticks.</p></div>`
      : `<div class="empty"><span class="big">🏝️</span>No time logged that day.<p>A day off, or a day of meetings.</p></div>`;
  } else {
    $('list').innerHTML = tasks.map((t, i) => {
      const c = colorFor(t.gid);
      const n = t.entries?.length || 0;
      return `<a class="tk ${t.live ? 'live' : ''}" data-gid="${esc(t.gid)}" style="--c:${c};animation-delay:${i*45}ms" ${t.url ? `href="${esc(t.url)}" target="_blank" rel="noopener"` : ''}>
        <div class="rank">${pad(i + 1)}</div>
        <div class="body">
          <span class="title">${esc(t.name)}</span>
          <div class="sub"><div class="bar"><i></i></div>
            <div class="chips">${Array.from({ length: Math.min(n, 8) }, () => '<b></b>').join('')}</div>
            <span class="pct"></span></div>
        </div>
        <div class="dur"><span class="d"></span><small>${t.live ? '● running' : `${n} session${n === 1 ? '' : 's'}`}</small></div>
      </a>`;
    }).join('');
  }
  renderRunning();
  tick();
}

function renderRunning(){
  const r = runningNow();
  $('hero').classList.toggle('ticking', !!r);
  if (!r) {
    const hb = live?.lastHeartbeat && now() - live.lastHeartbeat < 60000;
    const lost = mode === 'live' && !hb && live?.lastHeartbeat;
    $('running').innerHTML = `<div class="idle"><span class="z">z<sup>z</sup></span><div>Nothing ticking right now.
      <small>${hb ? 'Watching your Asana tabs — keep one open, even in the background.'
        : lost ? `Your Asana tab stopped reporting ${hm((now() - live.lastHeartbeat) / 1000)} ago. Is an Asana tab open? If it is, your browser is blocking the script from reaching Tracket — ${blockHint()} <a href="#" id="setupLink" style="color:var(--amber)">Setup guide</a>`
        : mode === 'live' ? 'Live timer not connected — <a href="#" id="setupLink" style="color:var(--amber)">set it up</a> (2 min).' : 'Open Asana in your browser so the userscript can watch your timer.'}</small></div></div>`;
    $('setupLink')?.addEventListener('click', (e) => { e.preventDefault(); openTimerSetup(false); });
    return;
  }
  const started = new Date(r.startedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('running').innerHTML = `<div class="onair"><div class="row">
      <div class="recdot"><i></i></div>
      <div class="meta"><span class="tag">● RUNNING</span><a class="name" ${r.url ? `href="${esc(r.url)}" target="_blank" rel="noopener"` : ''}>${esc(r.taskName || 'Untitled task')}</a></div>
      <div class="clock" id="runClock">00:00:00</div>
    </div>
    <div class="since"><span>started ${started}</span><button id="clearRun" title="Clear if this is wrong">not running?</button></div>
  </div>`;
  $('clearRun').onclick = async (e) => { e.preventDefault(); if (mode !== 'live') return; await api('/api/running', { method: 'DELETE' }); poll(); };
}

function tick(){
  if (mode === 'demo' && live) live.lastHeartbeat = Date.now();
  const { tasks, total, r } = totals();
  setOdo(total);
  if (r && $('runClock')) $('runClock').textContent = hms(r.sec);

  const pct = Math.round(total / 60 / GOAL_MIN * 100);
  $('goalPct').textContent = `${pct}%`;
  $('goalText').textContent = total / 60 >= GOAL_MIN ? 'day goal smashed ✦' : `${hm(Math.max(0, GOAL_MIN * 60 - total))} to an 8h day`;

  // tape: segments in chronological-ish (by size) order, scaled to max(goal,total)
  const scale = Math.max(GOAL_MIN * 60, total);
  const tape = $('tape');
  const want = tasks.map((t) => t.gid).join('|');
  if (tape.dataset.k !== want) {
    tape.dataset.k = want;
    tape.innerHTML = tasks.map((t) => `<div class="seg" data-gid="${esc(t.gid)}" style="background:${colorFor(t.gid)};width:0"></div>`).join('') +
      '<i class="min" title="7h minimum"></i>';
  }
  tape.querySelector('.min').style.left = `${MIN_DAY_MIN * 60 / scale * 100}%`;
  verdict(total);
  renderShift(total);
  tasks.forEach((t) => {
    const seg = tape.querySelector(`[data-gid="${CSS.escape(t.gid)}"]`);
    if (seg) { seg.style.width = `${t.sec / scale * 100}%`; seg.classList.toggle('run', !!t.live); }
    const row = document.querySelector(`.tk[data-gid="${CSS.escape(t.gid)}"]`);
    if (row) {
      row.querySelector('.d').textContent = t.live ? hms(t.sec) : hm(t.sec);
      row.querySelector('.bar i').style.width = `${total ? t.sec / tasks[0].sec * 100 : 0}%`;
      row.querySelector('.pct').textContent = total ? `${Math.round(t.sec / total * 100)}%` : '';
    }
  });

  // little celebration every full hour
  const hours = Math.floor(total / 3600);
  if (lastHourShown !== null && hours > lastHourShown && total - (tick.prev || 0) < 5) toast(`+1h · ${hours}h in the bag`);
  lastHourShown = hours; tick.prev = total;

  const hb = live?.lastHeartbeat && now() - live.lastHeartbeat < 60000;
  const offline = !navigator.onLine;
  $('link').classList.toggle('on', !!hb && !offline);
  $('link').classList.toggle('off', offline);
  $('linkText').textContent = offline ? 'Offline' : 'Asana link';
  $('link').title = offline ? 'No internet — will resync when back' : hb ? 'Userscript connected'
    : live?.lastHeartbeat ? `Asana tab stopped reporting — if Asana is open, ${blockHint()}` : 'No Asana tab reporting — open Asana in your browser';
  if (!isTodayView()) document.title = `${hm(total)} · ${dayName(viewDay, true)} · Tracket`;
  else document.title = r ? `${hms(total)} · ● ${r.taskName}` : `${hm(total)} today · Tracket`;
}

// How the day is going against the 7h minimum and the 8h goal.
const VERDICTS = {
  low: { today: 'Oh no! Are you sure you wanna log out now? You want to receive that mail?', past: 'Oh no! Under the 7h minimum — that’s a day that gets the mail.' },
  ok: { today: 'Hey man, you logged the bare minimum. You can tap out now if you want.', past: 'Bare minimum logged — 7h, you made it.' },
  over: { today: 'You sure you know what you’re doing? That’s enough work for today!', past: 'Over 8h — that was a big one.' },
};
const levelOf = (sec) => sec / 60 >= GOAL_MIN ? 'over' : sec / 60 >= MIN_DAY_MIN ? 'ok' : 'low';
function verdict(total){
  const el = $('verdict');
  if (!data) { el.hidden = true; return; }
  const level = levelOf(total);
  const today = isTodayView();
  const ask = today && mode === 'live' && 'Notification' in window && Notification.permission === 'default';
  const key = `${level}|${today}|${ask}`;
  if (el.dataset.k !== key) {
    el.dataset.k = key;
    el.className = `verdict ${level}`;
    el.innerHTML = `<span>${VERDICTS[level][today ? 'today' : 'past']}</span>${ask ? '<button id="notifyMe">🔔 Turn on reminders</button>' : ''}`;
    el.hidden = false;
    $('notifyMe')?.addEventListener('click', async () => { try { await Notification.requestPermission(); } catch {} el.dataset.k = ''; tick(); });
  }
  if (today && mode === 'live') checkAlerts(total);
}

// ---------- reminders (driven by today's duration) ----------
// - crossing 7h, and crossing 8h: once each, the moment it happens
// - under 7h: once if a timer stops in the last 30 min of your shift, and
//   once exactly when your shift ends
function notify(title, body, tag){
  toast(title);
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body, tag }); } catch {}
}
// true the first time it's called for a key (remembered per browser)
function once(key){
  try { if (localStorage.getItem(key)) return false; localStorage.setItem(key, '1'); return true; }
  catch { once.m ||= new Set(); if (once.m.has(key)) return false; once.m.add(key); return true; }
}
function checkAlerts(total){
  const day = data.date || todayStr, level = levelOf(total);
  if (level === 'over' && once(`tk_8h_${day}`)) { once(`tk_7h_${day}`); notify('8h logged — that’s enough for today', VERDICTS.over.today, 'tk8'); }
  else if (level !== 'low' && once(`tk_7h_${day}`)) notify('7h logged ✦ bare minimum done', VERDICTS.ok.today, 'tk7');
  // a stopped timer drops out of the total for a few seconds before Asana logs
  // it — judge "under 7h" on the day's peak so that dip can't trigger it
  if (checkAlerts.day !== day) { checkAlerts.day = day; checkAlerts.peak = 0; }
  checkAlerts.peak = Math.max(checkAlerts.peak, total);
  const s = shiftFor(day), t = now();
  if (s && levelOf(checkAlerts.peak) === 'low' && t >= s.to && t - s.to < 5 * 60000 && once(`tk_end_${day}`))
    notify(`Shift over — ${hm(total)} logged, under 7h`, VERDICTS.low.today, 'tkend');
}
// Called by poll() when the running timer stops; `total` includes that timer.
function onTimerStop(total){
  if (mode !== 'live' || !isTodayView() || !data) return;
  const day = data.date || todayStr, s = shiftFor(day), t = now();
  if (s && levelOf(total) === 'low' && t >= s.to - 30 * 60000 && t < s.to && once(`tk_stop_${day}`))
    notify(`Timer stopped at ${hm(total)} — under 7h`, VERDICTS.low.today, 'tkstop');
}

// ---------- work shift ----------
let shift = null; // { days: { '1': { start: '10:00', end: '19:00' } } }, 0 = Sunday
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DEMO_SHIFT = { days: Object.fromEntries([1, 2, 3, 4, 5].map((d) => [d, { start: '10:00', end: '19:00' }])) };
const shiftNow = () => (mode === 'demo' ? DEMO_SHIFT : shift);
const atTime = (day, hhmm) => { const d = parseDay(day); const [h, m] = hhmm.split(':').map(Number); d.setHours(h, m, 0, 0); return d.getTime(); };
function shiftFor(day){
  const v = shiftNow()?.days?.[parseDay(day).getDay()];
  return v ? { ...v, from: atTime(day, v.start), to: atTime(day, v.end) } : null;
}
const clock = (hhmm) => new Date(atTime('2000-01-01', hhmm)).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const minSec = MIN_DAY_MIN * 60;

// Live shift progress + a score: 100 = exactly on pace for the 7h minimum.
function renderShift(total){
  const el = $('shift');
  if (!data || (mode !== 'live' && mode !== 'demo')) { el.hidden = true; return; }
  let html;
  const day = data.date || viewDay || todayStr;
  if (!shiftNow()) {
    html = `<div class="row"><span>Add your work shift to see live progress, a score, and get a reminder before your day ends.</span><button data-shift>Set shift</button></div>`;
  } else {
    const s = shiftFor(day), t = now(), today = isTodayView();
    const grade = (n) => (n >= 100 ? 'good' : n >= 85 ? 'mid' : 'bad');
    const score = (n, label) => `<span class="score ${grade(n)}">${Math.min(n, 999)}<small>${label}</small></span>`;
    const bar = (f) => `<div class="sbar"><i style="width:${Math.max(0, Math.min(1, f)) * 100}%"></i></div>`;
    if (!s) html = `<div class="row"><span><b>Day off</b> — anything logged is a bonus.</span><button data-shift>Edit shift</button></div>`;
    else {
      const hours = `${clock(s.start)} – ${clock(s.end)}`;
      const len = s.to - s.from;
      if (!today || t >= s.to) {
        const n = Math.round(total / minSec * 100);
        html = `<div class="row"><span>Shift ${today ? 'over' : 'was'} · <b>${hours}</b></span>${score(n, n >= 100 ? 'minimum met' : 'of 7h')}</div>
          ${bar(1)}<div class="sub">${hm(total)} logged of the 7h minimum.</div>`;
      } else if (t < s.from) {
        html = `<div class="row"><span>Shift <b>${hours}</b> · starts in ${hm((s.from - t) / 1000)}</span><button data-shift>Edit</button></div>${bar(0)}`;
      } else {
        const elapsed = t - s.from, expected = minSec * elapsed / len;
        const n = Math.round(total / Math.max(expected, 60) * 100);
        const projected = total * len / elapsed;
        const need = Math.max(0, minSec - total);
        html = `<div class="row"><span>Shift <b>${hours}</b> · ${hm((s.to - t) / 1000)} left</span>${score(n, n >= 100 ? 'on pace' : n >= 85 ? 'a bit behind' : 'behind')}</div>
          ${bar(elapsed / len)}
          <div class="sub">${need ? `${hm(need)} to go for 7h · ` : '7h done · '}at this pace ≈ <b>${hm(projected)}</b> by ${clock(s.end)}</div>`;
      }
    }
  }
  if (el.dataset.h !== html) {
    el.dataset.h = html; el.innerHTML = html; el.hidden = false;
    el.querySelector('[data-shift]')?.addEventListener('click', () => (mode === 'live' ? openShift() : openLogin()));
  }
}

function openShift(){
  const cur = shift?.days || DEMO_SHIFT.days;
  const rows = [1, 2, 3, 4, 5, 6, 0].map((d) => {
    const v = cur[d], dv = v || { start: '10:00', end: '19:00' };
    return `<div class="srow ${v ? '' : 'off'}" data-d="${d}"><label><input type="checkbox" ${v ? 'checked' : ''}> ${DAYS[d]}</label>
      <input type="time" class="st" value="${dv.start}" aria-label="${DAYS[d]} start"><span>–</span><input type="time" class="en" value="${dv.end}" aria-label="${DAYS[d]} end"></div>`;
  }).join('');
  const el = modal(`<h3>Work shift</h3>
    <p class="lead">Tick your working days and set their hours. Tracket uses them for live progress and your score, and reminds you if you’re under 7h near the end of your shift.</p>
    <div class="srows">${rows}</div>
    <p class="lead" style="margin:12px 0 0"><a href="#" id="copyMon">Copy Monday’s hours to every working day</a></p>
    <div class="formerr" id="shErr"></div>
    <button class="btn" id="shSave" style="width:100%;margin-top:14px">Save shift</button>`);
  el.querySelectorAll('.srow input[type=checkbox]').forEach((c) => c.onchange = () => c.closest('.srow').classList.toggle('off', !c.checked));
  el.querySelector('#copyMon').onclick = (e) => {
    e.preventDefault();
    const mon = el.querySelector('.srow[data-d="1"]');
    el.querySelectorAll('.srow').forEach((r) => { if (r.querySelector('input[type=checkbox]').checked) { r.querySelector('.st').value = mon.querySelector('.st').value; r.querySelector('.en').value = mon.querySelector('.en').value; } });
  };
  el.querySelector('#shSave').onclick = async (e) => {
    const days = {};

function toast(msg){

}

const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function dayName(s, short){
  const t = todayStr || ymd(new Date());
  if (s === t) return 'today';
  const y = new Date(parseDay(t)); y.setDate(y.getDate() - 1);
  if (s === ymd(y)) return 'yesterday';
  return parseDay(s).toLocaleDateString([], short ? { weekday: 'short', day: 'numeric', month: 'short' } : { weekday: 'long', day: 'numeric', month: 'long' });
}
function shiftDay(n){
  const t = todayStr || ymd(new Date());
  const d = parseDay(viewDay || t); d.setDate(d.getDate() + n);
  const next = ymd(d);
  if (next > t) return;
  setDay(next === t ? null : next);
}
function setDay(day){
  viewDay = day;
  try { day ? history.replaceState(null, '', `?date=${day}`) : history.replaceState(null, '', location.pathname); } catch {}
  data = null; lastHourShown = null;
  $('list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  header();
  load(false);
}

function header(){
  const d = new Date(), h = d.getHours();
  const hi = h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 21 ? 'Good evening' : 'Late one, huh';
  const first = data?.user?.name?.split(' ')[0];
  $('greet').textContent = first ? `${hi}, ${first}` : hi;
  $('date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const t = todayStr || ymd(d), shown = viewDay || t, isNow = shown === t;
  const label = dayName(shown);
  $('dayLabel').textContent = label[0].toUpperCase() + label.slice(1);
  $('pick').value = shown; $('pick').max = t;
  $('next').disabled = isNow;
  $('goToday').hidden = isNow;
  $('eyebrow').textContent = isNow ? 'Logged today' : `Logged ${label}`;
  $('listTitle').textContent = isNow ? "Today's tickets" : 'Tickets';
  $('onairWrap').style.display = isNow ? '' : 'none';
}

// ---------- data ----------
async function load(force){
  if (mode === 'demo') return loadDemo();
  if (mode !== 'live') return;
  const want = viewDay;
  try {
    const qs = new URLSearchParams();
    if (want) qs.set('date', want);
    if (force) qs.set('force', '1');
    const body = await api('/api/today?' + qs);
    if (want !== viewDay) return; // user moved on to another day meanwhile
    // midnight rolled over while watching "today"
    if (todayStr && body.today !== todayStr && !viewDay) colorOrder.length = 0;
    todayStr = body.today;
    data = body;
    lastSig = body.sig;
    live = { running: body.running, lastHeartbeat: body.lastHeartbeat };
    clockSkew = body.serverNow - Date.now();
    $('err').classList.remove('show'); retry.n = 0; clearTimeout(retry.t);
    $('synced').textContent = `Synced ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
    header();
    renderStatic();
  } catch (e) {
      if (e.handled) return;
    const offline = !navigator.onLine || /fetch|network|ENOTFOUND|EAI_AGAIN|ECONN|timed out/i.test(e.message);
    $('err').textContent = offline ? '⚠ Can’t reach Asana right now — showing last known data, will resync automatically.' : `⚠ ${e.message}`;
    $('err').classList.add('show');
    if (!data) $('list').innerHTML = '';
    retry();
  }
}
// back-off retry while Asana/internet is unreachable
function retry(){
  clearTimeout(retry.t);
  retry.n = Math.min((retry.n || 0) + 1, 6);
  retry.t = setTimeout(() => load(true), 5000 * retry.n);
}

// Live updates: poll the server (works on serverless hosting too). The server
// refreshes Asana every ~20s and tells us via `sig` when the day's data changed.
let lastSig = null, polling = false;
async function poll(){
  if (polling || mode !== 'live' || !isTodayView()) return;
  polling = true;
  try {
    const next = await api('/api/live');
    const changed = JSON.stringify(next.running) !== JSON.stringify(live?.running);
    const stopped = live?.running && !next.running;
    if (stopped) onTimerStop(tick.prev || 0);
    clockSkew = next.serverNow - Date.now();
    live = next;
    if (!isTodayView()) return;
    if (next.sig && lastSig && next.sig !== lastSig) load(false);   // Asana data changed
    else if (stopped) setTimeout(() => load(true), 2500);            // let Asana save the entry
    else if (changed) renderStatic();
  } catch {} finally { polling = false; }
}

// ---------- api ----------
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'UTC'; } })();
let mode = 'boot';   // boot → demo (visitor) | connect (member, no Asana yet) | live
let meInfo = null;

async function api(path, opts = {}){
  const url = path + (path.includes('?') ? '&' : '?') + 'tz=' + encodeURIComponent(TZ);
  const init = { credentials: 'same-origin', ...opts };
  if (opts.json !== undefined) { init.method = init.method || 'POST'; init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(opts.json); }
  const res = await fetch(url, init);
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && body.error === 'login-required' && mode === 'live') { enterDemo(); const e = new Error('logged out'); e.handled = true; throw e; }
  if (res.status === 409 && body.error === 'asana-not-connected') { enterConnect(); const e = new Error('connect'); e.handled = true; throw e; }
  if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; throw e; }
  return body;
}

function modal(html, { wide = false, closable = true } = {}){

  if (closable) {
    el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) closeModal(); });
    modal.esc = (e) => { if (e.key === 'Escape') closeModal(); };
    addEventListener('keydown', modal.esc);
  }
  document.body.appendChild(el);
  setTimeout(() => el.querySelector('input:not(.hp)')?.focus(), 60);
  return el;
}
function closeModal(){ $('modal')?.remove(); if (modal.esc) removeEventListener('keydown', modal.esc); }
function form(el, handler){
  const f = el.querySelector('form');
  f.onsubmit = async (e) => {
    e.preventDefault();
    const btn = f.querySelector('button[type=submit],button:not([type])'); const err = f.querySelector('.formerr');

    btn.disabled = true;
    try { await handler(Object.fromEntries(new FormData(f)), f); }
    catch (x) { if (err) err.textContent = x.message; }
    finally { btn.disabled = false; }
  };
}

buildOdo();
try { const q = new URLSearchParams(location.search).get('date'); if (/^\d{4}-\d{2}-\d{2}$/.test(q || '') && q < ymd(new Date())) viewDay = q; } catch {}
header();
$('prev').onclick = () => shiftDay(-1);
$('next').onclick = () => shiftDay(1);
$('goToday').onclick = () => setDay(null);
// Chromium (Brave, Chrome, Edge) only opens the picker from its calendar icon,
// which is invisible here — open it explicitly on any click.
$('pick').addEventListener('click', (e) => { try { e.preventDefault(); e.target.showPicker(); } catch {} });
$('pick').onchange = (e) => { const v = e.target.value; if (v) setDay(v >= (todayStr || ymd(new Date())) ? null : v); };
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') shiftDay(-1);
  else if (e.key === 'ArrowRight') shiftDay(1);
  else if (e.key.toLowerCase() === 't') setDay(null);
});
// Auto-refresh: live timer via polling; finished entries when Asana changes,
// when the tab comes back into view, and when the internet returns.
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
addEventListener('online', () => { tick(); load(true); });
addEventListener('offline', tick);
// Background tabs get their timers throttled; a worker's timer isn't, so the
// tab title keeps ticking while you're on other sites.
try {
  const w = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 1000)'], { type: 'text/javascript' })));
  let n = 0;
  w.onmessage = () => { tick(); if (++n % 2 === 0) poll(); };
} catch { setInterval(tick, 1000); setInterval(poll, 2000); }
setInterval(() => { if (mode === 'live' && isTodayView()) load(false); }, 60 * 1000); // backup
boot();
</script>
</body>
</html>
