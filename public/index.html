<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Tracket</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracket">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<script src="/themes.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='17' r='12' fill='%23ffb547'/><rect x='14' y='1' width='4' height='5' rx='1' fill='%23ffb547'/><path d='M16 17V9' stroke='%230b0b10' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#0b0b10; --bg2:#12121a; --card:#16161f; --card2:#1c1c28; --line:#262635;
  --ink:#f3efe6; --mute:#8a879a; --dim:#55536a;
  --amber:#ffb547; --mint:#5cf2b0; --rec:#ff4d6d; --violet:#a78bfa;
  --amber2:#ff7a45; --field:#0c0c12; --panel:#101017; --scrim:#07070bcc; --on-accent:#0b0b10; --rec-ink:#ff9aac;
  --hero1:#1b1b27; --hero2:#121219; --onair1:#2a1420; --onair2:#171320; --banner1:#2a2112; --switch:#2a2a3a; --knob:#cfcbe0;
  --glow1:#ffb54722; --glow2:#a78bfa1f; --glow3:#5cf2b014; --grain:.07;
  --r:22px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --num:var(--mono); --display:var(--sans);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ambient backdrop: slow drifting glow + film grain */
.sky{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 15%, var(--glow1), transparent 70%),
    radial-gradient(35% 30% at 85% 30%, var(--glow2), transparent 70%),
    radial-gradient(45% 40% at 60% 95%, var(--glow3), transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(4deg)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 80px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--amber),var(--amber2));color:var(--on-accent);font-weight:800;font-size:20px;
  box-shadow:0 8px 30px -8px color-mix(in srgb,var(--amber) 53%,transparent);transform:rotate(-6deg)}
.hello{flex:1;min-width:0}
.hello .brand{display:block;font:800 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;margin-bottom:5px;
  background:linear-gradient(90deg,var(--amber),var(--amber2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.hello span{font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:8px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:color-mix(in srgb,var(--ink) 2%,transparent)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.on i{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.pill.on{color:var(--ink)}
.pill.off i{background:var(--rec);box-shadow:0 0 10px var(--rec)}
.days{display:flex;align-items:center;gap:6px;margin:-14px 0 18px}
.days button,.days label{height:36px;min-width:36px;padding:0 12px;border-radius:12px;display:inline-grid;place-items:center;
  background:var(--card);border:1px solid var(--line);font:600 12px/1 var(--mono);color:var(--mute);cursor:pointer;
  transition:transform .2s,border-color .2s,color .2s,background .2s;position:relative}
.days button:hover,.days label:hover{border-color:var(--amber);color:var(--ink);background:var(--card2)}
.days button:active,.days label:active{transform:scale(.94)}
.days button:disabled{opacity:.3;pointer-events:none}
.days label{flex:1;max-width:260px;color:var(--ink)}
.days input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.days .today{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 33%,transparent)}
.days .today[hidden]{display:none}

/* ---------- hero total ---------- */
.hero{position:relative;padding:34px 30px 28px;border-radius:32px;overflow:hidden;
  background:linear-gradient(160deg,var(--hero1) 0%,var(--hero2) 70%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 2%,transparent) 0 1px,transparent 1px 38px)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}
.eyebrow .live{color:var(--rec);display:none}
.hero.ticking .eyebrow .live{display:inline-flex;align-items:center;gap:6px}
.eyebrow .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

.odo{display:flex;align-items:flex-end;margin:16px 0 6px;font:800 clamp(64px,15vw,132px)/1 var(--num);letter-spacing:-.06em;
  font-variant-numeric:tabular-nums}
.digit{position:relative;display:inline-block;height:1em;width:.62em;overflow:hidden}
.digit .reel{position:absolute;left:0;top:0;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.25,.9,.3,1)}
.digit .reel span{height:1em;display:block;text-align:center}
.sep{width:.42em;text-align:center;color:var(--dim);transform:translateY(-.06em);margin-left:-.04em}
.odo .sec{font-size:.42em;color:var(--mute);margin-left:.18em;align-self:flex-end;transform:translateY(-.16em);display:flex}
.odo .sec .digit{width:.62em}
.hero.ticking .odo{filter:drop-shadow(0 0 28px color-mix(in srgb,var(--amber) 25%,transparent))}
.odo .sec .reel{transition-duration:.3s}

.goal{display:flex;justify-content:space-between;font:400 12px/1 var(--mono);color:var(--mute);margin:18px 0 10px}
.goal b{color:var(--ink);font-weight:600}
.tape{position:relative}
.tape .min{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.35;border-radius:2px;pointer-events:none}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0;padding:10px 14px;border-radius:14px;font:500 13px/1.45 var(--sans,inherit);border:1px solid var(--line);background:var(--card)}
.verdict[hidden]{display:none}
.shift{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 2%,transparent);font-size:13px;line-height:1.45;color:var(--mute)}
.shift .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shift b{color:var(--ink);font-weight:600}
.shift .score{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;font:800 18px/1 var(--num)}
.shift .score small{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.shift .good{color:var(--mint)} .shift .mid{color:var(--amber)} .shift .bad{color:var(--rec)}
.shift .sbar{position:relative;height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.shift .sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--violet);border-radius:6px}
.shift .sub{margin-top:8px;font-size:12px}
.shift button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:5px 10px;font:600 11px/1 var(--mono);cursor:pointer}
.shift button:hover{border-color:var(--amber)}
.srows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:100px 1fr auto 1fr;gap:8px;align-items:center}
.srow label{display:flex;gap:8px;align-items:center;font:600 13px var(--mono);cursor:pointer}
.srow input[type=time]{min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 10px;font:400 14px var(--mono);color-scheme:dark}
.srow.off input[type=time],.srow.off span{opacity:.3;pointer-events:none}
@media (max-width:480px){
  .srow{grid-template-columns:92px 1fr auto 1fr;gap:6px}
  .srow input[type=time]{padding:8px 6px;font-size:13px}
  .srow input[type=time]::-webkit-calendar-picker-indicator{display:none} /* phones open their own picker on tap */
}
.verdict.low{border-color:color-mix(in srgb,var(--rec) 33%,transparent);color:var(--rec-ink)}
.verdict.ok{border-color:color-mix(in srgb,var(--amber) 33%,transparent);color:var(--amber)}
.verdict.over{border-color:color-mix(in srgb,var(--mint) 33%,transparent);color:var(--mint)}
.verdict button{margin-left:auto;background:none;border:1px solid currentColor;color:inherit;border-radius:10px;padding:4px 10px;font:600 11px/1 var(--mono);cursor:pointer}
.tape{position:relative;height:14px;border-radius:99px;background:var(--field);border:1px solid var(--line);overflow:hidden;display:flex}
.tape .seg{height:100%;transition:width .8s cubic-bezier(.2,.9,.3,1);position:relative}
.tape .seg + .seg{box-shadow:inset 2px 0 0 var(--field)}
.tape .seg.run{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 20%,transparent) 0 6px,transparent 6px 12px)!important;animation:stripes 1s linear infinite;background-size:17px 17px}
@keyframes stripes{to{background-position:17px 0}}
.ticks{display:flex;justify-content:space-between;font:400 10px/1 var(--mono);color:var(--dim);margin-top:8px;padding:0 1px}

/* ---------- sections ---------- */
h2{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:40px 4px 14px;display:flex;align-items:center;gap:10px}
h2 .count{color:var(--dim)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* on-air card */
.onair{position:relative;border-radius:var(--r);padding:22px 22px 20px;overflow:hidden;
  background:linear-gradient(135deg,var(--onair1),var(--onair2) 55%);border:1px solid color-mix(in srgb,var(--rec) 27%,transparent);
  box-shadow:0 20px 60px -30px color-mix(in srgb,var(--rec) 53%,transparent)}
.onair::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(color-mix(in srgb,var(--rec) 33%,transparent),transparent 70%);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.6}}
.onair .row{position:relative;display:flex;align-items:center;gap:18px}
.recdot{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--rec) 12%,transparent);border:1px solid color-mix(in srgb,var(--rec) 33%,transparent)}
.recdot i{width:18px;height:18px;border-radius:50%;background:var(--rec);box-shadow:0 0 20px var(--rec);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);box-shadow:0 0 6px var(--rec)}}
.onair .meta{flex:1;min-width:0}
.tag{font:800 10px/1 var(--mono);letter-spacing:.2em;color:var(--rec);display:block;margin-bottom:8px}
.onair .name{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.onair .name:hover{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--rec) 53%,transparent);text-underline-offset:4px}
.onair .clock{font:800 34px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.onair .since{position:relative;font:400 12px/1 var(--mono);color:var(--mute);margin-top:14px;display:flex;justify-content:space-between;gap:10px}
.onair .since button{color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.onair .since button:hover{color:var(--ink)}

.idle{border-radius:var(--r);padding:22px;border:1px dashed var(--line);color:var(--mute);display:flex;gap:16px;align-items:center;font-size:15px}
.idle .z{font:800 22px/1 var(--mono);color:var(--dim);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-8deg)}}
.idle small{display:block;color:var(--dim);font:400 12px/1.5 var(--mono);margin-top:4px}

/* ticket list */
.list{display:grid;gap:10px}
.tk{--c:var(--amber);position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:16px 18px 16px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .2s,background .2s;opacity:0;animation:rise .5s cubic-bezier(.2,1,.3,1) forwards}
.tk:hover{transform:translateY(-2px) rotate(-.25deg);border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:var(--card2)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rank{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 14px/1 var(--num);
  color:var(--on-accent);background:var(--c);box-shadow:0 6px 20px -8px var(--c)}
.tk .body{min-width:0}
.warn{display:inline-flex;align-items:flex-start;gap:6px;margin-top:6px;padding:4px 8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--amber) 33%,transparent);background:color-mix(in srgb,var(--amber) 6%,transparent);
  color:var(--amber);font:600 11px/1.35 var(--mono);white-space:normal}
.onair .warn{position:relative;margin-top:10px}
.tk .title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tk .sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.bar{flex:1;height:5px;border-radius:9px;background:var(--field);overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.chips{display:flex;gap:4px}
.chips b{width:6px;height:6px;border-radius:2px;background:color-mix(in srgb,var(--c) 70%,transparent)}
.pct{font:400 11px/1 var(--mono);color:var(--dim)}
.dur{font:800 20px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-align:right}
.dur small{display:block;font:400 11px/1 var(--mono);color:var(--dim);margin-top:6px;letter-spacing:0}
.tk.live{border-color:color-mix(in srgb,var(--rec) 33%,transparent)}
.tk.live .dur{color:var(--rec)}

.empty{text-align:center;padding:50px 20px;border-radius:var(--r);border:1px dashed var(--line);color:var(--mute)}
.empty .big{font-size:44px;display:block;margin-bottom:12px;filter:grayscale(.2)}
.empty p{font:400 13px/1.6 var(--mono);color:var(--dim);margin-top:6px}

.err{margin-top:18px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--rec) 8%,transparent);border:1px solid color-mix(in srgb,var(--rec) 27%,transparent);color:var(--rec-ink);font:400 13px/1.5 var(--mono);display:none}
.err.show{display:block}

footer{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:400 11px/1.4 var(--mono);color:var(--dim)}
kbd{font:600 10px/1 var(--mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mute)}

.toast{position:fixed;left:50%;bottom:30px;z-index:10;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;
  padding:12px 18px;border-radius:99px;background:var(--amber);color:var(--on-accent);font:800 14px/1 var(--mono);
  box-shadow:0 12px 40px -10px color-mix(in srgb,var(--amber) 67%,transparent);transition:all .5s cubic-bezier(.2,1.5,.4,1)}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}

.skel{height:70px;border-radius:18px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- modals, forms, banner ---------- */
.btn{height:44px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--amber);color:var(--on-accent);font-weight:800;font-size:15px;transition:transform .15s,filter .2s;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--amber)}
.btn.danger{background:transparent;color:var(--rec);border:1px solid color-mix(in srgb,var(--rec) 33%,transparent);font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mute);transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--amber);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}

.intro{margin:-6px 0 22px}
.intro h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
.intro h1 em{font-style:normal;background:linear-gradient(90deg,var(--amber),var(--amber2) 60%,var(--rec));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin-top:10px;color:var(--mute);font-size:16px;line-height:1.5;max-width:520px}
.banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:-10px 0 26px;padding:18px 20px;border-radius:22px;
  background:linear-gradient(120deg,var(--banner1),var(--onair2) 60%);border:1px solid color-mix(in srgb,var(--amber) 27%,transparent)}
.banner .txt{flex:1;min-width:220px}
.banner b{display:block;font-size:17px;margin-bottom:4px}
.banner span{color:var(--mute);font-size:14px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.demo-tag{position:fixed;top:14px;right:-38px;z-index:5;transform:rotate(45deg);background:var(--amber);color:var(--on-accent);font:800 10px/1 var(--mono);letter-spacing:.2em;padding:6px 44px;pointer-events:none}

.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:var(--scrim);backdrop-filter:blur(10px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:28px 24px 24px;border-radius:26px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 30px 80px -30px #000;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.sheet.wide{max-width:560px}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.sheet h3{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.sheet p.lead{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:18px}
.sheet .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;color:var(--mute);font-size:20px}
.sheet .x:hover{background:var(--card2);color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field input,.field textarea{width:100%;border-radius:13px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:12px 14px;font:400 15px var(--sans);outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--amber)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.formerr{color:var(--rec-ink);font:400 13px/1.4 var(--mono);min-height:18px;margin:4px 0 10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:44px;display:block;margin-bottom:10px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:34px;color:var(--mute);font-size:14px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:7px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font:800 11px/1 var(--mono);color:var(--amber)}
.steps b{color:var(--ink);font-weight:600}
.steps a,.lead a,.sec a{color:var(--amber)}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h4{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec .status{font:600 12px var(--mono);color:var(--mint)}
.sec .status.off{color:var(--rec)}
.sec p{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:12px}
details.how{margin-top:12px;color:var(--mute);font-size:14px}
details.how summary{cursor:pointer;color:var(--ink);font-weight:600}
details.how ol{margin:10px 0 0;padding-left:20px;line-height:1.6}
.seg-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.seg-tabs button{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--mute);font:600 12px var(--mono)}
.seg-tabs button.on{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
.steps a.btn,.sec a.btn{color:var(--on-accent)}
.sec a.btn.ghost{color:var(--ink)}
.btn.sm-inline{height:30px;padding:0 12px;border-radius:9px;font-size:13px;vertical-align:middle}
.steps small{display:block;margin-top:8px;color:var(--dim);font-size:13px;line-height:1.9}
.note-open{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--amber) 6%,transparent);border:1px solid color-mix(in srgb,var(--amber) 20%,transparent);color:var(--mute);font-size:13px;line-height:1.55}
.note-open b{color:var(--ink)}
.waiting{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--field);border:1px dashed var(--line);color:var(--mute);font-size:14px}
.waiting i{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:blink 1.2s infinite;flex:none}
.waiting.done{border-style:solid;border-color:color-mix(in srgb,var(--mint) 33%,transparent);color:var(--ink)}
.waiting.done i{background:var(--mint);box-shadow:0 0 10px var(--mint);animation:none}
code{font:400 12px var(--mono);background:var(--field);border:1px solid var(--line);padding:2px 6px;border-radius:6px}
@media (max-width:560px){
  .wrap{padding:calc(20px + env(safe-area-inset-top)) 16px 60px}
  .hero{padding:26px 20px 22px;border-radius:26px}
  .pill{display:none}
  .onair .row{flex-wrap:wrap}
  .onair .clock{font-size:28px;width:100%;padding-left:72px;margin-top:-4px}
  .tk{gap:12px;padding:14px}
  .tk .title{white-space:normal;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chips{display:none}
  .onair .name{font-size:18px}
  .dur{font-size:17px}
}
/* ---------- alerts, auto mode, comments, lunch ---------- */
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rec);color:#fff;font:800 10px/18px var(--mono);text-align:center}
.flags{display:flex;flex-wrap:wrap;gap:0 6px}
.warn.cmt{border-color:color-mix(in srgb,var(--violet) 33%,transparent);background:color-mix(in srgb,var(--violet) 7%,transparent);color:var(--violet)}
.warn.lunch{border-color:color-mix(in srgb,var(--ink) 27%,transparent);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);align-items:center}
.warn .act{margin-left:4px;border:1px solid currentColor;border-radius:6px;padding:2px 7px;font:inherit;color:inherit;cursor:pointer;background:none}
.warn .act:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.warn .act[disabled]{opacity:.5;pointer-events:none}
.lunchpat{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 85%,transparent) 0 3px,var(--field) 3px 6px)}
.tape .seg .lunch{position:absolute;top:0;bottom:0;right:0;width:0;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 85%,transparent) 0 3px,var(--field) 3px 6px);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.shift .sbar .lunchband{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 73%,transparent) 0 3px,transparent 3px 6px);border-radius:0}
.legend{display:flex;justify-content:flex-end;gap:12px;font:400 10px/1 var(--mono);color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:16px;height:8px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.notes{display:grid;gap:8px;margin:-10px 0 22px}
.notes:empty{display:none}
.notes .n{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--amber) 27%,transparent);background:color-mix(in srgb,var(--amber) 5%,transparent);color:var(--ink);font-size:13px;line-height:1.45}
.notes .n button{margin-left:auto;border:1px solid currentColor;border-radius:10px;padding:5px 10px;font:600 11px/1 var(--mono);color:var(--amber)}
.autocard{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;width:min(440px,calc(100vw - 32px));padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--amber);box-shadow:0 24px 70px -20px #000;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.autocard .row{display:flex;align-items:center;gap:12px}
.autocard .k{font:800 10px/1 var(--mono);letter-spacing:.18em;color:var(--amber);margin-bottom:6px}
.autocard .t{font-weight:600;font-size:15px}
.autocard .s{font:800 30px/1 var(--num);color:var(--amber);min-width:44px;text-align:right}
.autocard .deny{border:1px solid var(--rec);background:color-mix(in srgb,var(--rec) 13%,transparent);color:var(--rec-ink);border-radius:11px;padding:10px 16px;font-weight:700}
.autocard .pb{height:4px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.autocard .pb i{display:block;height:100%;background:var(--amber);transition:width .25s linear}
.alist{display:grid;gap:8px}
.alist .a{padding:10px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.alist .a.new{border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.alist .a b{font-weight:600;font-size:14px}
.alist .a p{color:var(--mute);font-size:13px;line-height:1.45;margin:3px 0 0}
.alist .a small{display:block;color:var(--dim);font:400 11px var(--mono);margin-top:5px}
.sw{display:flex;align-items:flex-start;gap:10px;cursor:pointer;color:var(--ink);font-size:14px;line-height:1.9}
.sw > span{flex:1;min-width:0}
.sw input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--amber);flex:none}
.sw input[type=number]{width:74px;margin:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:6px 8px;font:400 14px var(--mono)}
.lunchrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font:600 13px var(--mono)}
.lunchrow input{min-width:0;flex:1;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 10px;font:400 14px var(--mono);color-scheme:dark}
.hint{display:block;font-size:12px;color:var(--dim);line-height:1.5;margin-top:6px}
.cmd{display:block;white-space:pre-wrap;word-break:break-all;margin:8px 0;padding:10px;font-size:11px;line-height:1.5}

/* ---------- icons ---------- */
.ic{width:18px;height:18px;flex:none}
h2 .ic{width:14px;height:14px;color:var(--dim)}

/* ---------- quick dock (home) ---------- */
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:-12px 0 28px}
.tile{--t:var(--amber);position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px;border-radius:18px;text-align:left;
  background:linear-gradient(160deg,color-mix(in srgb,var(--t) 10%,var(--card)),var(--card) 70%);border:1px solid var(--line);
  transition:transform .2s cubic-bezier(.3,1.5,.5,1),border-color .2s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--t) 60%,var(--line))}
.tile:active{transform:scale(.97)}
.tile .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--t);
  background:color-mix(in srgb,var(--t) 16%,transparent);border:1px solid color-mix(in srgb,var(--t) 35%,transparent)}
.tile .ti .ic{width:19px;height:19px}
.tile .tt{min-width:0;display:grid;gap:3px}
.tile b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tile small{font:500 11px/1.3 var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on small{color:var(--t)}
.tile .dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--t);box-shadow:0 0 10px var(--t)}
@media (max-width:720px){.dock{grid-template-columns:repeat(2,1fr)}}

/* ---------- switches (all checkboxes in .sw) ---------- */
.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:40px;height:24px;margin:2px 0 0;border-radius:99px;flex:none;cursor:pointer;
  background:var(--switch);border:1px solid var(--line);transition:background .2s,border-color .2s}
.sw input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--knob);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
.sw input[type=checkbox]:checked{background:var(--amber);border-color:var(--amber)}
.sw input[type=checkbox]:checked::after{transform:translateX(16px);background:var(--on-accent)}
.sw input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
.sw input[type=checkbox]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sw{line-height:1.5;align-items:center}
.sw .lbl b{display:block;font-weight:600}
.sw .lbl small b{display:inline;color:var(--ink)}
.sw .lbl small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- settings: tabbed panel ---------- */
.sheet.settings{max-width:880px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:210px 1fr;min-height:min(620px,calc(100vh - 32px));max-height:calc(100vh - 32px)}
.snav{padding:22px 12px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px;overflow:auto}
.snav .who{padding:4px 10px 16px;font-size:12px;color:var(--mute);line-height:1.4;word-break:break-all}
.snav .who b{display:block;color:var(--ink);font-size:18px;letter-spacing:-.02em;margin-bottom:2px;word-break:normal}
.snav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mute);font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s}
.snav button:hover{background:var(--card2);color:var(--ink)}
.snav button.on{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--ink)}
.snav button.on .ic{color:var(--amber)}
.snav button .st{margin-left:auto;flex:none;width:7px;height:7px;padding:0;border-radius:50%;background:var(--rec)}
.snav button .st.on{background:var(--mint)}
.snav .grow{flex:1}
.snav a.guide{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mute);font-size:13px}
.snav a.guide:hover{color:var(--amber)}
.spane{padding:26px 28px 28px;overflow:auto}
.ph{display:flex;gap:14px;align-items:flex-start;margin:0 40px 20px 0}
.ph .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);border:1px solid color-mix(in srgb,var(--amber) 25%,transparent)}
.ph .pi .ic{width:22px;height:22px}
.ph h3{margin:0 0 4px}
.ph p{color:var(--mute);font-size:14px;line-height:1.5}
.group{padding:16px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.group .gh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600;font-size:15px}
.group .gh .ic{color:var(--mute);width:16px;height:16px}
.group p{color:var(--mute);font-size:14px;line-height:1.5;margin:0 0 12px}
.group p:last-child{margin-bottom:0}
.group .row2{margin-top:4px}
.badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);padding:5px 9px;border-radius:99px;color:var(--rec);background:color-mix(in srgb,var(--rec) 8%,transparent);border:1px solid color-mix(in srgb,var(--rec) 25%,transparent);white-space:nowrap}
.badge.on{color:var(--mint);background:color-mix(in srgb,var(--mint) 7%,transparent);border-color:color-mix(in srgb,var(--mint) 25%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.linkish{color:var(--amber);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkish.danger{color:var(--rec-ink)}
.savebar{position:sticky;bottom:-28px;margin:16px -28px -28px;padding:14px 28px 18px;background:linear-gradient(180deg,transparent,var(--card) 30%);display:flex;align-items:center;gap:12px}
.savebar .btn{flex:1}
.savebar .formerr{margin:0;flex:1}
.capin{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--mono);color:var(--mute)}
.capin input{width:64px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 10px;font:600 15px var(--mono);text-align:center}
.capin input:focus{border-color:var(--amber);outline:none}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.flow div{padding:12px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:12px;line-height:1.45;color:var(--mute)}
.flow div b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.flow div i{font:800 11px/1 var(--mono);color:var(--amber);font-style:normal;display:block;margin-bottom:8px}
@media (max-width:720px){
  .set{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .snav{flex-direction:row;padding:14px 12px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:6px;scrollbar-width:none}
  .snav::-webkit-scrollbar{display:none}
  .snav::after{content:"";flex:0 0 40px}
  .snav .who,.snav .grow,.snav a.guide{display:none}
  .snav button{flex:none;padding:8px 12px;font-size:13px;white-space:nowrap}
  .snav button .st{margin-left:2px}
  .spane{padding:20px 16px 24px}
  .savebar{bottom:-24px;margin:16px -16px -24px;padding:12px 16px 16px}
  .flow{grid-template-columns:1fr}
  .ph{margin-right:36px}
}

/* ---------- history ---------- */
.hist{margin-top:4px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.hstats div{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.hstats b{display:block;font:800 22px/1 var(--num);letter-spacing:-.03em}
.hstats small{display:block;margin-top:6px;font:500 11px/1.3 var(--mono);color:var(--mute);letter-spacing:.04em}
.hchart{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:200px;padding:0 2px;border-bottom:1px solid var(--line)}
.hchart .l7{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--ink) 33%,transparent);pointer-events:none}
.hchart .l7 span{position:absolute;left:-2px;top:-16px;font:600 10px var(--mono);color:var(--mute)}
.hcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;border-radius:8px;position:relative}
.hcol:hover .hb{filter:brightness(1.2)}
.hcol .hb{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--c);min-height:3px;transition:height .7s cubic-bezier(.2,.9,.3,1)}
.hcol .hb.none{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 8%,transparent) 0 4px,transparent 4px 8px);border:1px dashed var(--line)}
.hcol .hv{font:600 10px var(--num);color:var(--mute);margin-bottom:6px;white-space:nowrap}
.hcol.sel .hb{box-shadow:0 0 0 2px var(--ink)}
.hdays{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:8px}
.hdays span{text-align:center;font:600 10px/1.3 var(--mono);color:var(--dim)}
.hdays span b{display:block;color:var(--mute);font-size:11px}
.hdays span.we{opacity:.55}
.hkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font:500 11px var(--mono);color:var(--mute)}
.hkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.hcol .hv{display:none}.hstats b{font-size:18px}}
.intro h1,.sheet h3,.hello b,.tile b,.onair .name,.banner b{font-family:var(--display)}

/* ---------- the main Start / Stop control ---------- */
.herotop{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.herotop .eyebrow{flex:1;min-width:0}
.ctl{display:flex;align-items:center;gap:8px}
.go{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 6px;border-radius:99px;max-width:300px;
  background:var(--amber);color:var(--on-accent);font-weight:700;font-size:14px;box-shadow:0 10px 30px -12px var(--amber);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.07)} .go:active{transform:scale(.96)}
.go .k{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--on-accent) 16%,transparent)}
.go .k svg{width:16px;height:16px}
.go .l{min-width:0;display:grid;text-align:left;line-height:1.15}
.go .l small{font:500 11px/1.2 var(--mono);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go.stop{background:var(--rec);color:#fff;box-shadow:0 10px 30px -12px var(--rec)}
.go.stop .k{background:#ffffff26}
.go.busy{pointer-events:none;opacity:.85}
.go.busy .k svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.go[disabled]{opacity:.5;pointer-events:none}
.pop{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent)}
.pop:hover{color:var(--ink);border-color:var(--amber)}
.pop svg{width:17px;height:17px}
.tk .play{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;margin:0 0 6px auto;color:var(--on-accent);background:var(--c);opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
.tk:hover .play,.tk:focus-within .play{opacity:1;transform:none}
.tk .play svg{width:12px;height:12px}
@media (hover:none){.tk .play{opacity:.9;transform:none}}
@media (max-width:560px){.go{height:44px;max-width:190px;font-size:13px}.go .k{width:32px;height:32px}.herotop{flex-wrap:wrap}}

/* ---------- offline banner, skeletons ---------- */
.offline{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;
  background:var(--card2);border:1px solid color-mix(in srgb,var(--rec) 45%,transparent);color:var(--ink);font:600 12px/1.2 var(--mono);box-shadow:0 10px 30px -10px #000a}
.offline i{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
.skel.tkskel{display:grid;grid-template-columns:38px 1fr 70px;gap:16px;align-items:center;padding:16px;height:auto;background:var(--card);border:1px solid var(--line);animation:none}
.skel.tkskel b,.skel.tkskel i,.skel.tkskel u{display:block;border-radius:10px;background:linear-gradient(90deg,var(--card2) 0%,color-mix(in srgb,var(--ink) 8%,var(--card2)) 50%,var(--card2) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.skel.tkskel b{height:38px;border-radius:12px} .skel.tkskel u{height:20px}
.skel.tkskel i{height:12px;margin:4px 0;width:80%} .skel.tkskel i+i{width:45%}

/* ---------- command bar (⌘K) ---------- */
.cmdk{position:fixed;inset:0;z-index:70;display:grid;justify-items:center;align-content:start;padding:12vh 16px 16px;background:var(--scrim);backdrop-filter:blur(8px);animation:fade .15s}
.cmdk .box{width:min(560px,100%);border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 80px -30px #000;overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:500 17px var(--sans);padding:16px 18px;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
.cmdk li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mute);font-size:14px;cursor:pointer}
.cmdk li b{color:var(--ink);font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk li.on{background:color-mix(in srgb,var(--amber) 14%,transparent)}
.cmdk li .ic{color:var(--dim)} .cmdk li.on .ic{color:var(--amber)}
.cmdk li kbd{margin-left:auto}
.cmdk .foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--dim)}

/* ---------- tour ---------- */
.tour{position:fixed;inset:0;z-index:80;pointer-events:none}
.tour .hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px var(--scrim),0 0 0 2px var(--amber);transition:all .35s cubic-bezier(.2,.9,.3,1)}
.tour .tip{position:fixed;width:min(320px,calc(100vw - 32px));padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--amber);box-shadow:0 20px 60px -20px #000;pointer-events:auto;transition:top .35s,left .35s}
.tour .tip b{display:block;font-size:16px;margin-bottom:4px}
.tour .tip p{color:var(--mute);font-size:14px;line-height:1.5}
.tour .tip .acts{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour .tip .acts span{font:500 11px var(--mono);color:var(--dim);margin-right:auto}
.tour .tip .btn{height:36px;padding:0 14px;font-size:13px}

/* ---------- history tabs, weeks, insights ---------- */
.htabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.htabs button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--mute);font:600 12px var(--mono)}
.htabs button.on{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
.htabs .grow{flex:1}
.ibars{display:grid;gap:8px}
.ibar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.ibar b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibar span{font:600 12px var(--mono);color:var(--mute)}
.ibar i{grid-column:1/-1;height:8px;border-radius:6px;background:var(--field);overflow:hidden}
.ibar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c,var(--amber));border-radius:6px}
.isec{margin-top:22px}
.isec h4{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.chipsx{display:flex;flex-wrap:wrap;gap:6px}
.chipsx span{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--field);font-size:12px}
.chipsx span b{font:600 11px var(--mono);color:var(--amber);margin-left:6px}
.itbl{width:100%;border-collapse:collapse;font-size:13px}
.itbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.itbl td:not(:first-child){text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--mute)}
.itbl a{color:var(--ink)} .itbl .over{color:var(--rec)} .itbl .fine{color:var(--mint)}
.itbl th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:0 4px 6px}
.itbl th:first-child{text-align:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $ = (id) => document.getElementById(id);
let PALETTE = TT.palette(); // ticket colours, per theme
const GOAL_MIN = 8 * 60;
const MIN_DAY_MIN = 7 * 60; // below this the day doesn't count as a full one
// The Asana script reports every 60s (instantly on start/stop), so a report
// newer than this = connected. Matches FRESH_MS on the server.
const FRESH_MS = 150000;
// How often to ask the server (free-tier friendly): looking at it, open but
// not focused (e.g. a second screen), and in a background tab.
const POLL_MS = { focused: 4000, visible: 12000, hidden: 90000 };
// The owner's lines (grammar tidied, meaning kept).
const LINES = {
  comment: 'Dude, you forgot to mention what you did on this ticket. All good?',
  lunch: 'Your timer ran during lunch today. Want to fix that?',
};

const SKEL = '<div class="skel tkskel"><b></b><span><i></i><i></i></span><u></u></div>'.repeat(3);
let data = null;       // /api/today
let live = null;       // SSE running payload
let clockSkew = 0;     // serverNow - Date.now()
let lastHourShown = null;
let viewDay = null;    // YYYY-MM-DD being shown; null = today
let todayStr = null;   // server's today
const isTodayView = () => !viewDay || viewDay === todayStr;

// ---------- helpers ----------
const pad = (n) => String(n).padStart(2, '0');
// Colours follow the order tickets were first worked on today, so they never
// collide (for the first 8) and don't reshuffle when ranking changes.
const colorOrder = [];
const colorFor = (gid) => { let i = colorOrder.indexOf(gid); if (i < 0) i = colorOrder.push(gid) - 1; return PALETTE[i % PALETTE.length]; };
function assignColors(tasks){
  const first = (t) => Math.min(...(t.entries || []).map((e) => Date.parse(e.createdAt) - e.minutes * 60000), t.live ? runningNow().startedAt : Infinity);
  [...tasks].sort((a, b) => first(a) - first(b)).forEach((t) => colorFor(t.gid));
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function hm(sec){ const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60); return h ? `${h}h ${pad(m)}m` : `${m}m`; }
function hms(sec){ sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; }
const now = () => Date.now() + clockSkew;

// Line icons (24px grid, drawn with currentColor).
const ICON = {
  pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bolt: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  laptop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  coffee: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  palette: '<circle cx="13.5" cy="6.5" r="1.3"/><circle cx="17.5" cy="10.5" r="1.3"/><circle cx="8.5" cy="7.5" r="1.3"/><circle cx="6.5" cy="12.5" r="1.3"/><path d="M12 2a10 10 0 0 0 0 20c.93 0 1.5-.75 1.5-1.6 0-.42-.16-.8-.43-1.1-.26-.29-.42-.67-.42-1.1 0-.9.73-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.6-10-8.6z"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// Lunch window of the day being shown, in ms (from the member's settings).
function lunchWin(){
  const L = data?.lunch, day = data?.date;
  return L && day ? { ...L, from: atTime(day, L.start), to: atTime(day, L.end) } : null;
}
function runningNow(){
  const r = isTodayView() ? live?.running : null;
  if (!r) return null;
  const L = lunchWin(), t = now();
  const lunchSec = L ? Math.max(0, Math.min(t, L.to) - Math.max(r.startedAt, L.from)) / 1000 : 0;
  return { ...r, sec: (t - r.startedAt) / 1000, lunchSec };
}

// ---------- odometer ----------
function buildOdo(){
  const mk = () => `<span class="digit"><span class="reel">${[...Array(10)].map((_,i)=>`<span>${i}</span>`).join('')}</span></span>`;
  $('odo').innerHTML = `${mk()}${mk()}<span class="sep">:</span>${mk()}${mk()}<span class="sec">${mk()}${mk()}</span>`;
}
function setOdo(totalSec){
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.min(99, Math.floor(totalSec / 3600)), m = Math.floor(totalSec % 3600 / 60), s = totalSec % 60;
  const digits = `${pad(h)}${pad(m)}${pad(s)}`;
  document.querySelectorAll('#odo .reel').forEach((reel, i) => {
    const d = +digits[i];
    if (reel.dataset.d !== String(d)) { reel.dataset.d = d; reel.style.transform = `translateY(${-d}em)`; }
  });
}

// ---------- render ----------
function totals(){
  const tasks = (data?.tasks || []).map((t) => ({ ...t, sec: t.minutes * 60, lunchSec: (t.lunchMin || 0) * 60 }));
  const r = runningNow();
  if (r) {
    const hit = tasks.find((t) => t.gid === r.taskGid) || tasks.find((t) => r.taskGid.startsWith('name:') && t.name.trim() === r.taskName);
    if (hit) { hit.sec += r.sec; hit.lunchSec += r.lunchSec; hit.runLunch = r.lunchSec; hit.live = true; if (r.check !== undefined) hit.check = r.check; }
    else tasks.push({ gid: r.taskGid, name: r.taskName, url: r.url, minutes: 0, sec: r.sec, lunchSec: r.lunchSec, runLunch: r.lunchSec, entries: [], live: true, fresh: true, check: r.check });
  }
  tasks.sort((a, b) => b.sec - a.sec);
  return { tasks, total: tasks.reduce((s, t) => s + t.sec, 0), r };
}

// ⚠ chip for tickets that may not be yours (see checkTasks on the server)
const warnChip = (c) => (c && !c.ok ? `<span class="warn" title="Are you sure this is your task? The assignee or Task Status says otherwise.">⚠ ${esc(c.reasons.join(' · '))}</span>` : '');
// 💬 time logged that day but no comment from you on the ticket that day
const cmtChip = (t) => (t.comment === false ? `<span class="warn cmt" title="No comment from you on this ticket that day">💬 ${esc(LINES.comment)}</span>` : '');
// 🍽 logged time that fell inside lunch, with a button that takes it off in Asana
function lunchChip(t){
  if (t.lunchMin > 0) return `<span class="warn lunch">🍽 ${hm(t.lunchMin * 60)} during lunch <button class="act" data-lunch="${esc(t.gid)}">Remove lunch</button></span>`;
  if (t.runLunch > 60) return `<span class="warn lunch">🍽 running through lunch</span>`;
  return '';
}

function renderStatic(){
  const { tasks, total } = totals();
  assignColors(tasks);
  $('count').textContent = tasks.length ? `· ${tasks.length}` : '';
  if (!tasks.length) {
    $('list').innerHTML = isTodayView()
      ? `<div class="empty"><span class="big">🌙</span>Clean slate.<p>Start a timer on any Asana ticket —<br>it'll land here the moment it ticks.</p></div>`
      : `<div class="empty"><span class="big">🏝️</span>No time logged that day.<p>A day off, or a day of meetings.</p></div>`;
  } else {
    $('list').innerHTML = tasks.map((t, i) => {
      const c = colorFor(t.gid);
      const n = t.entries?.length || 0;
      return `<a class="tk ${t.live ? 'live' : ''}" data-gid="${esc(t.gid)}" style="--c:${c};animation-delay:${i*45}ms" ${t.url ? `href="${esc(t.url)}" target="_blank" rel="noopener"` : ''}>
        <div class="rank">${pad(i + 1)}</div>
        <div class="body">
          <span class="title">${esc(t.name)}</span>
          <div class="flags">${warnChip(t.check)}${cmtChip(t)}${lunchChip(t)}</div>
          <div class="sub"><div class="bar"><i></i></div>
            <div class="chips">${Array.from({ length: Math.min(n, 8) }, () => '<b></b>').join('')}</div>
            <span class="pct"></span></div>
        </div>
        <div class="dur">${!t.live && isTodayView() && /^\d+$/.test(t.gid) ? `<button class="play" data-play="${esc(t.gid)}" title="${runningNow() ? 'Switch the timer to this ticket' : 'Start this ticket'}" aria-label="Start this ticket">${PLAY}</button>` : ''}<span class="d"></span><small>${t.live ? '● running' : `${n} session${n === 1 ? '' : 's'}`}</small></div>
      </a>`;
    }).join('');
  }
  renderRunning();
  tick();
}

function renderRunning(){
  const r = runningNow();
  $('hero').classList.toggle('ticking', !!r);
  if (!r) {
    const hb = live?.lastHeartbeat && now() - live.lastHeartbeat < FRESH_MS;
    const lost = mode === 'live' && !hb && live?.lastHeartbeat;
    $('running').innerHTML = `<div class="idle"><span class="z">z<sup>z</sup></span><div>Nothing ticking right now.
      <small>${hb ? 'Watching your Asana tabs — keep one open, even in the background.'
        : lost ? `Your Asana tab stopped reporting ${hm((now() - live.lastHeartbeat) / 1000)} ago. Is an Asana tab open? If it is, your browser is blocking the script from reaching Tracket — ${blockHint()} <a href="#" id="setupLink" style="color:var(--amber)">Setup guide</a>`
        : mode === 'live' ? 'Live timer not connected — <a href="#" id="setupLink" style="color:var(--amber)">set it up</a> (2 min).' : 'Open Asana in your browser so the userscript can watch your timer.'}</small></div></div>`;
    $('setupLink')?.addEventListener('click', (e) => { e.preventDefault(); openTimerSetup(false); });
    return;
  }
  const started = new Date(r.startedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('running').innerHTML = `<div class="onair"><div class="row">
      <div class="recdot"><i></i></div>
      <div class="meta"><span class="tag">${TT.word('running', '● RUNNING')}</span><a class="name" ${r.url ? `href="${esc(r.url)}" target="_blank" rel="noopener"` : ''}>${esc(r.taskName || 'Untitled task')}</a>${warnChip(r.check)}</div>
      <div class="clock" id="runClock">00:00:00</div>
    </div>
    <div class="since"><span>started ${started}</span><button id="clearRun" title="Clear if this is wrong">not running?</button></div>
  </div>`;
  $('clearRun').onclick = async (e) => { e.preventDefault(); if (mode !== 'live') return; await api('/api/running', { method: 'DELETE' }); poll(); };
}

function tick(){
  if (mode === 'demo' && live) live.lastHeartbeat = Date.now();
  const { tasks, total, r } = totals();
  setOdo(total);
  if (r && $('runClock')) $('runClock').textContent = hms(r.sec);

  const pct = Math.round(total / 60 / GOAL_MIN * 100);
  $('goalPct').textContent = `${pct}%`;
  $('goalText').textContent = TT.xp()
    ? (total / 60 >= GOAL_MIN ? 'MAX LEVEL ✦' : total / 60 >= MIN_DAY_MIN ? `LV 7 · ${hm(GOAL_MIN * 60 - total)} XP to max` : `${hm(MIN_DAY_MIN * 60 - total)} XP to level up`)
    : total / 60 >= GOAL_MIN ? 'day goal smashed ✦' : `${hm(Math.max(0, GOAL_MIN * 60 - total))} to an 8h day`;

  // tape: segments in chronological-ish (by size) order, scaled to max(goal,total)
  const scale = Math.max(GOAL_MIN * 60, total);
  const tape = $('tape');
  const want = tasks.map((t) => t.gid).join('|');
  if (tape.dataset.k !== want) {
    tape.dataset.k = want;
    tape.innerHTML = tasks.map((t) => `<div class="seg" data-gid="${esc(t.gid)}" style="background:${colorFor(t.gid)};width:0"><b class="lunch"></b></div>`).join('') +
      '<i class="min" title="7h minimum"></i>';
  }
  tape.querySelector('.min').style.left = `${MIN_DAY_MIN * 60 / scale * 100}%`;
  $('legend').hidden = !tasks.some((t) => t.lunchSec > 30);
  verdict(total);
  renderShift(total);
  renderDock();
  renderAutoCard();
  renderCtl();
  if (pip) try { pip.render(); } catch {}
  tasks.forEach((t) => {
    const seg = tape.querySelector(`[data-gid="${CSS.escape(t.gid)}"]`);

    }

    if (row) {
      row.querySelector('.d').textContent = t.live ? hms(t.sec) : hm(t.sec);
      row.querySelector('.bar i').style.width = `${total ? t.sec / tasks[0].sec * 100 : 0}%`;
      row.querySelector('.pct').textContent = total ? `${Math.round(t.sec / total * 100)}%` : '';
    }
  });

  // little celebration every full hour
  const hours = Math.floor(total / 3600);
  if (lastHourShown !== null && hours > lastHourShown && total - (tick.prev || 0) < 5) { toast(`+1h · ${hours}h in the bag`); TT.fx('hour'); }
  // 7h / 8h crossed while watching today (not on load)
  const lvl = !data || !isTodayView() ? null : total / 60 >= GOAL_MIN ? 2 : total / 60 >= MIN_DAY_MIN ? 1 : 0;
  if (lvl !== null && tick.lvl != null && lvl > tick.lvl) TT.fx(lvl === 2 ? 'h8' : 'h7');
  tick.lvl = lvl;
  lastHourShown = hours; tick.prev = total;

  const hb = live?.lastHeartbeat && now() - live.lastHeartbeat < FRESH_MS;
  const offline = !navigator.onLine;
  $('link').classList.toggle('on', !!hb && !offline);
  $('link').classList.toggle('off', offline);
  $('linkText').textContent = offline ? 'Offline' : 'Asana link';
  $('link').title = offline ? 'No internet — will resync when back' : hb ? 'Userscript connected'
    : live?.lastHeartbeat ? `Asana tab stopped reporting — if Asana is open, ${blockHint()}` : 'No Asana tab reporting — open Asana in your browser';
  if (!isTodayView()) document.title = `${hm(total)} · ${dayName(viewDay, true)} · Tracket`;
  else document.title = r ? `${hms(total)} · ● ${r.taskName}` : `${hm(total)} today · Tracket`;
}

// How the day is going against the 7h minimum and the 8h goal.
const VERDICTS = {
  low: { today: 'Oh no! Are you sure you want to log off now? Do you really want to get that email?', past: 'Oh no! Under the 7h minimum — that’s a day that gets the email.' },
  ok: { today: 'Hey, you’ve logged the bare minimum. You can tap out now if you want.', past: 'Bare minimum logged — 7h, you made it.' },
  over: { today: 'Are you sure you know what you’re doing? That’s enough work for today!', past: 'Over 8h — that was a big one.' },
};
const levelOf = (sec) => sec / 60 >= GOAL_MIN ? 'over' : sec / 60 >= MIN_DAY_MIN ? 'ok' : 'low';
function verdict(total){
  const el = $('verdict');

  const key = `${level}|${today}|${ask}`;

}

// ---------- reminders ----------
// Tracket's server decides every reminder (7h/8h, shift end, ⚠ ticket, 💬 no
// comment, 🍽 lunch, auto mode) so they also work with no tab open. Devices
// with push turned on get them as notifications; this tab shows each new one
// as a toast (plus a browser notification when this device has no push).
let alertsFeed = { items: [], seen: 0 };
let pushActive = false;
const lastShownKey = 'tk_alert_last';
const getLS = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const setLS = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

async function pollAlerts(){
  if (mode !== 'live') return;
  let f;
  try { f = await api('/api/alerts'); } catch { return; }
  const newest = f.items.length ? f.items[f.items.length - 1].id : 0;
  const last = +getLS(lastShownKey) || 0;
  if (last) {
    const fresh = f.items.filter((a) => a.id > last);
    fresh.slice(-3).forEach((a, i) => setTimeout(() => {
      toast(a.title);
      try { if (!pushActive && 'Notification' in window && Notification.permission === 'granted') new Notification(a.title, { body: a.body, tag: `tk${a.id}` }); } catch {}
    }, i * 3000));
    // seen here, so the menu bar 🔔 clears too
    if (fresh.length && !document.hidden) f.seen = (await api('/api/alerts/seen', { json: { upTo: newest } }).catch(() => ({ seen: f.seen }))).seen;
  }
  if (newest) setLS(lastShownKey, String(newest));
  alertsFeed = f;
  renderBell();
}
function renderBell(){
  const n = alertsFeed.items.filter((a) => a.id > (alertsFeed.seen || 0)).length;
  $('bellN').hidden = !n; $('bellN').textContent = n > 9 ? '9+' : n;
}
async function openAlerts(){
  const items = [...alertsFeed.items].reverse();
  const seen = alertsFeed.seen || 0;
  const time = (id) => new Date(id).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  const el = modal(`<h3>Alerts</h3>
    <p class="lead">Everything Tracket reminded you about lately.${pushActive ? '' : ' <a href="#" id="alPush">Get these as notifications on this device</a>'}</p>
    <div class="alist">${items.length ? items.map((a) => `<div class="a ${a.id > seen ? 'new' : ''}"><b>${esc(a.title)}</b>${a.body ? `<p>${esc(a.body)}</p>` : ''}<small>${time(a.id)}</small></div>`).join('') : '<p class="lead">Nothing yet.</p>'}</div>`, { wide: true });
  el.querySelector('#alPush')?.addEventListener('click', (e) => { e.preventDefault(); openSettings('alerts'); });
  if (items.length) { alertsFeed.seen = (await api('/api/alerts/seen', { json: { upTo: items[0].id } }).catch(() => ({ seen }))).seen; renderBell(); }
}

// ---------- push (Web Push: desktop, Android, iPhone home-screen app → watch) ----------
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
function deviceName(){
  const ua = navigator.userAgent;
  const os = isIOS ? (/iPad/.test(ua) || !/iPhone/.test(ua) ? 'iPad' : 'iPhone') : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Linux';
  return `${BROWSERS[detectBrowser()] || 'Browser'} · ${os}${standalone() ? ' app' : ''}`;
}
async function swReg(){ return pushSupported() ? navigator.serviceWorker.register('/sw.js') : null; }
async function checkPush(){
  try {
    const reg = await swReg();
    const sub = reg && Notification.permission === 'granted' && (await reg.pushManager.getSubscription());
    pushActive = !!sub;
    if (sub) api('/api/push', { json: { sub: sub.toJSON(), ua: deviceName() } }).catch(() => {}); // keep it on file
  } catch { pushActive = false; }
}
async function enablePush(){
  if (!pushSupported()) {
    if (isIOS && !standalone()) throw new Error('On iPhone/iPad: tap Share → Add to Home Screen, open Tracket from the Home Screen, log in there once, then turn notifications on in its Settings.');
    if ('Notification' in window) { await Notification.requestPermission(); return; }
    throw new Error('This browser can’t show notifications.');
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications are blocked for this site — allow them in your browser’s site settings, then try again.' : 'Notifications weren’t allowed.');
  const reg = await swReg();
  await navigator.serviceWorker.ready;
  const { key } = await api('/api/push/key');
  let sub = await reg.pushManager.getSubscription();
  const subKey = sub?.options?.applicationServerKey;
  if (sub && subKey && b64u(subKey) !== key) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64u(key) });
  await api('/api/push', { json: { sub: sub.toJSON(), ua: deviceName() } });
  pushActive = true;
}
async function disablePush(){
  const reg = await swReg();
  const sub = reg && (await reg.pushManager.getSubscription());
  if (sub) { await api('/api/push', { method: 'DELETE', json: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
  pushActive = false;
}

// ---------- auto mode: the 25s countdown card ----------
function renderAutoCard(){
  const a = mode === 'live' ? live?.auto : null;
  const el = $('autocard');
  if (!a || a.status !== 'pending' || a.kind === 'manual' || renderAutoCard.denied === a.id) { el.hidden = true; el.dataset.id = ''; return; }
  const left = a.deadline - now();
  if (left < -120000) { el.hidden = true; return; }
  if (el.dataset.id !== a.id) {
    el.dataset.id = a.id;
    el.innerHTML = `<div class="row"><div style="flex:1;min-width:0"><div class="k">${a.kind === 'failsafe' ? 'FAILSAFE' : 'AUTO MODE'}</div><div class="t">${esc(a.title.replace(/ in \d+s/, ''))}</div><small class="hint" id="acNote"></small></div>
      <div class="s" id="acSec"></div>${a.noDeny ? '' : '<button class="deny" id="acDeny">Deny</button>'}</div><div class="pb"><i id="acBar"></i></div>`;
    if ($('acDeny')) $('acDeny').onclick = async () => {
      renderAutoCard.denied = a.id; el.hidden = true;
      try { await api('/api/auto', { json: { id: a.id, op: 'deny' } }); toast('Denied — Tracket won’t do it today'); } catch (x) { toast(x.message); }

  $('acBar').style.width = `${Math.max(0, Math.min(1, left / Math.max(1, a.deadline - (a.issuedAt || a.deadline - 25000)))) * 100}%`;
}

// ---------- work shift ----------
let shift = null; // { days: { '1': { start: '10:00', end: '19:00' } } }, 0 = Sunday
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DEMO_SHIFT = { days: Object.fromEntries([1, 2, 3, 4, 5].map((d) => [d, { start: '10:00', end: '19:00' }])) };
const shiftNow = () => (mode === 'demo' ? DEMO_SHIFT : shift);
const DEMO_PREFS = { lunch: { start: '13:00', end: '14:00' }, auto: { cap: { on: true, hours: 7 }, lunch: true }, report: { on: false } };
const atTime = (day, hhmm) => { const d = parseDay(day); const [h, m] = hhmm.split(':').map(Number); d.setHours(h, m, 0, 0); return d.getTime(); };
function shiftFor(day){
  const v = shiftNow()?.days?.[parseDay(day).getDay()];
  return v ? { ...v, from: atTime(day, v.start), to: atTime(day, v.end) } : null;
}
const clock = (hhmm) => new Date(atTime('2000-01-01', hhmm)).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const minSec = MIN_DAY_MIN * 60;

// Live shift progress + a score: 100 = exactly on pace for the 7h minimum.
function renderShift(total){
  const el = $('shift');
  if (!data || (mode !== 'live' && mode !== 'demo')) { el.hidden = true; return; }
  let html;
  const day = data.date || viewDay || todayStr;
  if (!shiftNow()) {
    html = `<div class="row"><span>Add your work shift to see live progress, a score, and get a reminder before your day ends.</span><button data-shift>Set shift</button></div>`;
  } else {
    const s = shiftFor(day), t = now(), today = isTodayView();
    const grade = (n) => (n >= 100 ? 'good' : n >= 85 ? 'mid' : 'bad');
    const score = (n, label) => `<span class="score ${grade(n)}">${Math.min(n, 999)}<small>${label}</small></span>`;
    const L = lunchWin();
    const band = () => {
      if (!s || !L) return '';
      const len = s.to - s.from, a = Math.max(0, (L.from - s.from) / len), b = Math.min(1, (L.to - s.from) / len);
      return b > a ? `<b class="lunchband" style="left:${a * 100}%;width:${(b - a) * 100}%" title="Lunch ${L.start}–${L.end}"></b>` : '';
    };
    const bar = (f) => `<div class="sbar"><i style="width:${Math.max(0, Math.min(1, f)) * 100}%"></i>${band()}</div>`;
    if (!s) html = `<div class="row"><span><b>Day off</b> — anything logged is a bonus.</span><button data-shift>Edit shift</button></div>`;
    else {
      const hours = `${clock(s.start)} – ${clock(s.end)}`;
      const len = s.to - s.from;
      if (!today || t >= s.to) {
        const n = Math.round(total / minSec * 100);
        html = `<div class="row"><span>Shift ${today ? 'over' : 'was'} · <b>${hours}</b></span>${score(n, n >= 100 ? 'minimum met' : 'of 7h')}</div>
          ${bar(1)}<div class="sub">${hm(total)} logged of the 7h minimum.</div>`;
      } else if (t < s.from) {
        html = `<div class="row"><span>Shift <b>${hours}</b> · starts in ${hm((s.from - t) / 1000)}</span><button data-shift>Edit</button></div>${bar(0)}`;
      } else {
        const elapsed = t - s.from, expected = minSec * elapsed / len;
        const n = Math.round(total / Math.max(expected, 60) * 100);
        const projected = total * len / elapsed;
        const need = Math.max(0, minSec - total);
        html = `<div class="row"><span>Shift <b>${hours}</b> · ${hm((s.to - t) / 1000)} left</span>${score(n, n >= 100 ? 'on pace' : n >= 85 ? 'a bit behind' : 'behind')}</div>
          ${bar(elapsed / len)}
          <div class="sub">${need ? `${hm(need)} to go for 7h · ` : '7h done · '}at this pace ≈ <b>${hm(projected)}</b> by ${clock(s.end)}</div>`;
      }
    }
  }
  if (el.dataset.h !== html) {
    el.dataset.h = html; el.innerHTML = html; el.hidden = false;
    el.querySelector('[data-shift]')?.addEventListener('click', () => (mode === 'live' ? openShift() : openLogin()));
  }
}

function openShift(){ openSettings('day'); }
function openAuto(){ openSettings('auto'); }

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}

const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function dayName(s, short){
  const t = todayStr || ymd(new Date());
  if (s === t) return 'today';
  const y = new Date(parseDay(t)); y.setDate(y.getDate() - 1);
  if (s === ymd(y)) return 'yesterday';
  return parseDay(s).toLocaleDateString([], short ? { weekday: 'short', day: 'numeric', month: 'short' } : { weekday: 'long', day: 'numeric', month: 'long' });
}
function shiftDay(n){
  const t = todayStr || ymd(new Date());
  const d = parseDay(viewDay || t); d.setDate(d.getDate() + n);
  const next = ymd(d);
  if (next > t) return;
  setDay(next === t ? null : next);
}
function setDay(day){
  viewDay = day;
  try { day ? history.replaceState(null, '', `?date=${day}`) : history.replaceState(null, '', location.pathname); } catch {}
  data = null; lastHourShown = null;
  $('list').innerHTML = SKEL;
  header();
  load(false);
}

function header(){
  const d = new Date(), h = d.getHours();
  const hi = h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 21 ? 'Good evening' : 'Late one, huh';
  const first = data?.user?.name?.split(' ')[0];
  $('greet').textContent = first ? `${hi}, ${first}` : hi;
  $('date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const t = todayStr || ymd(d), shown = viewDay || t, isNow = shown === t;
  const label = dayName(shown);
  $('dayLabel').textContent = label[0].toUpperCase() + label.slice(1);
  $('pick').value = shown; $('pick').max = t;
  $('next').disabled = isNow;
  $('goToday').hidden = isNow;
  $('eyebrow').textContent = isNow ? TT.word('eyebrow', 'Logged today') : `Logged ${label}`;
  $('listTitle').textContent = isNow ? TT.word('list', "Today's tickets") : 'Tickets';
  $('onairWrap').style.display = isNow ? '' : 'none';
}

// ---------- data ----------
async function load(force){
  if (mode === 'demo') return loadDemo();
  if (mode !== 'live') return;
  const want = viewDay;
  try {
    const qs = new URLSearchParams();
    if (want) qs.set('date', want);
    if (force) qs.set('force', '1');
    const body = await api('/api/today?' + qs);
    if (want !== viewDay) return; // user moved on to another day meanwhile
    // midnight rolled over while watching "today"
    if (todayStr && body.today !== todayStr && !viewDay) colorOrder.length = 0;
    todayStr = body.today;
    data = body;
    lastSig = body.sig;
    live = { ...live, running: body.running, lastHeartbeat: body.lastHeartbeat };
    clockSkew = body.serverNow - Date.now();
    $('err').classList.remove('show'); retry.n = 0; clearTimeout(retry.t);
    $('synced').textContent = `Synced ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
    header();
    renderStatic();
    renderNotes();
  } catch (e) {
      if (e.handled) return;
    const offline = !navigator.onLine || /fetch|network|ENOTFOUND|EAI_AGAIN|ECONN|timed out/i.test(e.message);
    renderOffline();
    $('err').textContent = offline ? '⚠ Can’t reach Asana right now — showing last known data, will resync automatically.' : `⚠ ${e.message}`;
    $('err').classList.add('show');
    if (!data) $('list').innerHTML = '';
    retry();
  }
}
// back-off retry while Asana/internet is unreachable
function retry(){
  clearTimeout(retry.t);
  retry.n = Math.min((retry.n || 0) + 1, 6);
  retry.t = setTimeout(() => load(true), 5000 * retry.n);
}

// Live updates: poll the server (works on serverless hosting too). The server
// refreshes Asana every ~20s and tells us via `sig` when the day's data changed.
let lastSig = null, polling = false;
function pollDue(){
  const every = Date.now() < boostUntil ? 1000 : document.hidden ? POLL_MS.hidden : document.hasFocus() ? POLL_MS.focused : POLL_MS.visible;
  return Date.now() - (poll.at || 0) >= every;
}
async function poll(){
  if (polling || mode !== 'live' || !isTodayView()) return;
  polling = true; poll.at = Date.now();
  try {
    const next = await api('/api/live' + (document.hidden ? '?bg=1' : ''));
    const changed = JSON.stringify(next.running) !== JSON.stringify(live?.running);
    const stopped = live?.running && !next.running;
    const newAuto = next.auto?.id !== live?.auto?.id || next.auto?.status !== live?.auto?.status;
    relayAuto(next.auto);
    if (live?.auto?.kind === 'manual' && !next.auto) boostUntil = Math.min(boostUntil, Date.now() + 4000); // done: a few more fast polls
    if (next.running && next.running.startedAt !== live?.running?.startedAt) TT.fx('start');
    else if (stopped) TT.fx('stop');
    if (stopped || (next.running && next.running.startedAt !== live?.running?.startedAt)) setTimeout(() => loadNext(stopped), 3000);
    clockSkew = next.serverNow - Date.now();
    live = next;
    renderNotes();
    // the feed is only fetched when its head says something changed
    const h = next.alertsHead, known = alertsFeed.items[alertsFeed.items.length - 1]?.id || 0;
    if (newAuto || (h && (h.last !== known || h.seen !== alertsFeed.seen))) pollAlerts();
    if (!isTodayView()) return;
    if (next.sig && lastSig && next.sig !== lastSig) load(false);   // Asana data changed
    else if (stopped) setTimeout(() => load(true), 2500);            // let Asana save the entry
    else if (changed) renderStatic();
  } catch {} finally { polling = false; }
}

// ---------- api ----------
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'UTC'; } })();
let mode = 'boot';   // boot → demo (visitor) | connect (member, no Asana yet) | live
let meInfo = null;

async function api(path, opts = {}){
  const url = path + (path.includes('?') ? '&' : '?') + 'tz=' + encodeURIComponent(TZ);
  const init = { credentials: 'same-origin', ...opts };
  if (opts.json !== undefined) { init.method = init.method || 'POST'; init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(opts.json); }
  const res = await fetch(url, init);
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && body.error === 'login-required' && mode === 'live') { enterDemo(); const e = new Error('logged out'); e.handled = true; throw e; }
  if (res.status === 409 && body.error === 'asana-not-connected') { enterConnect(); const e = new Error('connect'); e.handled = true; throw e; }
  if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; throw e; }
  return body;
}

function modal(html, { wide = false, closable = true, cls = '', focus = true } = {}){
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal';
  el.innerHTML = `<div class="sheet ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-modal="true">${closable ? '<button class="x" data-close aria-label="Close">×</button>' : ''}${html}</div>`;
  if (closable) {
    el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) closeModal(); });
    modal.esc = (e) => { if (e.key === 'Escape') closeModal(); };
    addEventListener('keydown', modal.esc);
  }
  document.body.appendChild(el);
  if (focus) setTimeout(() => el.querySelector('input:not(.hp)')?.focus(), 60);
  return el;
}
function closeModal(){ $('modal')?.remove(); if (modal.esc) removeEventListener('keydown', modal.esc); }
function form(el, handler, sel = 'form'){
  const f = el.querySelector(sel);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const btn = f.querySelector('button[type=submit],button:not([type])'); const err = f.querySelector('.formerr');
    if (err) err.textContent = '';
    btn.disabled = true;
    try { await handler(Object.fromEntries(new FormData(f)), f); }
    catch (x) { if (err) err.textContent = x.message; }
    finally { btn.disabled = false; }
  };
}
