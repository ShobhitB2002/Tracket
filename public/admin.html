<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="robots" content="noindex">
<title>Tracket admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='17' r='12' fill='%23ffb547'/><rect x='14' y='1' width='4' height='5' rx='1' fill='%23ffb547'/><path d='M16 17V9' stroke='%230b0b10' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#0b0b10; --card:#16161f; --card2:#1c1c28; --line:#262635;
  --ink:#f3efe6; --mute:#8a879a; --dim:#55536a;
  --amber:#ffb547; --mint:#5cf2b0; --rec:#ff4d6d;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--amber),#ff7a45);color:var(--bg);font-weight:800;font-size:20px;transform:rotate(-6deg)}
.top h1{flex:1;font-size:20px;letter-spacing:-.01em}
.top h1 small{display:block;font:400 12px var(--mono);color:var(--mute);margin-top:3px}
.btn{height:40px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:var(--bg);font-weight:800;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--amber)}
.btn.danger{background:transparent;color:var(--rec);border:1px solid #ff4d6d55;font-weight:600}
.btn.sm{height:32px;padding:0 11px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.stat{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font:800 30px/1 var(--mono);letter-spacing:-.04em}
.stat span{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block;margin-top:8px}
.stat.hot b{color:var(--amber)}
h2{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:30px 4px 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.item .who b{font-size:15px;font-weight:600}
.item .who .em{font:400 12px var(--mono);color:var(--mute);margin-left:6px}
.item .meta{font:400 12px var(--mono);color:var(--dim);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.item .note{margin-top:8px;color:var(--mute);font-size:14px;line-height:1.45;border-left:2px solid var(--line);padding-left:10px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:600 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--mint);border-color:#5cf2b044}
.tag.off{color:var(--rec);border-color:#ff4d6d44}
.tag.warn{color:var(--amber);border-color:#ffb54744}
.empty{padding:26px;border-radius:16px;border:1px dashed var(--line);color:var(--dim);text-align:center;font:400 13px var(--mono)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input{height:40px;border-radius:12px;border:1px solid var(--line);background:#0c0c12;color:var(--ink);padding:0 12px;font:400 14px var(--sans);outline:none;flex:1;min-width:150px}
input:focus{border-color:var(--amber)}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.gate form{width:100%;max-width:340px;display:grid;gap:14px;justify-items:center;padding:32px 24px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
.gate input{width:100%;height:46px}
.gate .btn{width:100%;height:46px}
.err{color:#ffb3c1;font:400 13px var(--mono);min-height:16px}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:#07070bcc;backdrop-filter:blur(10px)}
.sheet{width:100%;max-width:460px;padding:26px 24px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet p{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:14px}
.cred{font:400 14px/1.7 var(--mono);background:#0c0c12;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:var(--amber);color:var(--bg);font:800 13px var(--mono);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:620px){
  .wrap{padding:20px 16px 60px}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:14px}.stat b{font-size:24px}
  .item{grid-template-columns:1fr}
  .item .acts{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ago = (ms) => { if (!ms) return 'never'; const s = (Date.now() - ms) / 1000; if (s < 90) return 'just now'; if (s < 3600) return `${Math.round(s/60)}m ago`; if (s < 86400) return `${Math.round(s/3600)}h ago`; return `${Math.round(s/86400)}d ago`; };
const date = (ms) => new Date(ms).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

async function api(path, json){
  const res = await fetch(path, json === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(json) });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && body.error === 'admin-required') { gate(); throw new Error('locked'); }
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function gate(){
  $('app').innerHTML = `<div class="gate"><form><div class="logo">◔</div><b style="font-size:18px">Tracket admin</b>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" autofocus required>
    <button class="btn">Unlock</button><div class="err" id="err"></div></form></div>`;
  document.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('/api/admin/login', { password: $('pw').value }); render(); }
    catch (x) { $('err').textContent = x.message; $('pw').select(); }
  };
}

// Credentials to hand to a member — copy and send it to them however you like.
function showCreds(member, password, title){
  const login = location.origin + '/';
  const msg = `Hi ${member.name}! You now have access to Tracket 🎉\n\nLog in: ${login}\nEmail: ${member.email}\nPassword: ${password}\n\nAfter logging in, connect your Asana and open Settings to install the live-timer userscript. You can change your password in Settings.`;
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3><p>This password is shown <b>once</b>. Copy the message and send it to ${esc(member.name)}.</p>
    <div class="cred">${esc(msg)}</div>
    <div class="row"><button class="btn" id="cp">Copy message</button><a class="btn ghost" href="mailto:${encodeURIComponent(member.email)}?subject=${encodeURIComponent('Your Tracket access')}&body=${encodeURIComponent(msg)}">Email it</a></div>
    <button class="btn ghost" id="done" style="width:100%;margin-top:8px">Done</button></div>`;
  document.body.appendChild(el);
  el.querySelector('#cp').onclick = async (e) => { try { await navigator.clipboard.writeText(msg); e.target.textContent = 'Copied ✓'; } catch { e.target.textContent = 'Select & copy above'; } };
  el.querySelector('#done').onclick = () => { el.remove(); render(); };
}

async function act(btn, fn){ btn.disabled = true; try { await fn(); } catch (e) { if (e.message !== 'locked') alert(e.message); } finally { btn.disabled = false; } }

async function render(){
  let d;
  try { d = await api('/api/admin/overview'); } catch { return; }
  const pending = d.requests.filter((r) => r.status === 'pending');
  const past = d.requests.filter((r) => r.status !== 'pending').slice(0, 20);
  const active = d.members.filter((m) => m.status === 'active');

  $('app').innerHTML = `<main class="wrap">
    <header class="top"><div class="logo">◔</div><h1>Tracket admin<small>members & access requests · add yourself as a member to use your own dashboard</small></h1>
      <a class="btn ghost" href="/">Dashboard</a><button class="btn ghost" id="out">Log out</button></header>
    <div class="stats">
      <div class="stat ${pending.length ? 'hot' : ''}"><b>${pending.length}</b><span>Waiting</span></div>
      <div class="stat"><b>${active.length}</b><span>Members</span></div>
      <div class="stat"><b>${d.members.filter((m) => m.asana).length}</b><span>Asana linked</span></div>
    </div>

    <h2>Access requests</h2>
    <div class="list">${pending.length ? pending.map((r) => `
      <div class="item"><div><div class="who"><b>${esc(r.name)}</b><span class="em">${esc(r.email)}</span></div>
        <div class="meta"><span>${ago(r.at)}</span></div>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}</div>
        <div class="acts"><button class="btn sm" data-approve="${r.id}">Approve</button><button class="btn sm danger" data-deny="${r.id}">Deny</button></div></div>`).join('')
      : '<div class="empty">No one waiting. ✦</div>'}</div>

    <h2>Members</h2>
    <form class="add" id="add"><input name="name" placeholder="Name" maxlength="80"><input name="email" type="email" placeholder="Email" required><button class="btn">Add member</button></form>
    <div class="list">${d.members.length ? d.members.map((m) => `
      <div class="item"><div><div class="who"><b>${esc(m.name)}</b><span class="em">${esc(m.email)}</span></div>
        <div class="meta"><span class="tag ${m.status === 'active' ? 'ok' : 'off'}">${m.status}</span><span class="tag ${m.asana ? 'ok' : 'warn'}">${m.asana ? 'asana linked' : 'no asana yet'}</span>
          <span>active ${ago(m.lastActive)}</span><span>since ${date(m.createdAt)}</span></div></div>
        <div class="acts">
          <button class="btn sm ghost" data-reset="${m.id}">New password</button>
          <button class="btn sm ghost" data-toggle="${m.id}" data-status="${m.status}">${m.status === 'active' ? 'Pause' : 'Resume'}</button>
          <button class="btn sm danger" data-remove="${m.id}">Remove</button></div></div>`).join('')
      : '<div class="empty">No members yet.</div>'}</div>

    ${past.length ? `<h2>Decided</h2><div class="list">${past.map((r) => `
      <div class="item"><div><div class="who"><b>${esc(r.name)}</b><span class="em">${esc(r.email)}</span></div>
        <div class="meta"><span class="tag ${r.status === 'approved' ? 'ok' : 'off'}">${r.status}</span><span>${ago(r.decidedAt || r.at)}</span></div>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}</div>
        <div class="acts">${r.status === 'denied' ? `<button class="btn sm ghost" data-approve="${r.id}">Approve anyway</button>` : ''}<button class="btn sm ghost" data-forget="${r.id}">Delete</button></div></div>`).join('')}</div>` : ''}
  </main>`;

  const byId = Object.fromEntries(d.members.map((m) => [m.id, m]));
  $('out').onclick = async () => { await fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ which: 'admin' }) }); gate(); };
  document.querySelectorAll('[data-approve]').forEach((b) => b.onclick = () => act(b, async () => {
    const r = await api('/api/admin/approve', { id: b.dataset.approve });
    showCreds(r.member, r.password, `${r.member.name} is in`);
  }));
  document.querySelectorAll('[data-deny]').forEach((b) => b.onclick = () => act(b, async () => {
    if (!confirm('Deny this request?')) return;
    await api('/api/admin/deny', { id: b.dataset.deny }); toast('Denied'); render();
  }));
  document.querySelectorAll('[data-forget]').forEach((b) => b.onclick = () => act(b, async () => {
    await api('/api/admin/forget', { id: b.dataset.forget }); toast('Deleted'); render();
  }));
  document.querySelectorAll('[data-reset]').forEach((b) => b.onclick = () => act(b, async () => {
    const m = byId[b.dataset.reset];
    if (!confirm(`Give ${m.name} a new password? Their current one stops working.`)) return;
    const r = await api('/api/admin/reset', { id: m.id });
    showCreds(m, r.password, `New password for ${m.name}`);
  }));
  document.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => act(b, async () => {
    await api('/api/admin/status', { id: b.dataset.toggle, status: b.dataset.status === 'active' ? 'disabled' : 'active' });
    toast(b.dataset.status === 'active' ? 'Paused' : 'Resumed'); render();
  }));
  document.querySelectorAll('[data-remove]').forEach((b) => b.onclick = () => act(b, async () => {
    const m = byId[b.dataset.remove];
    if (!confirm(`Remove ${m.name}? Their account and stored Asana token are deleted.`)) return;
    await api('/api/admin/remove', { id: m.id }); toast('Removed'); render();
  }));
  $('add').onsubmit = (e) => { e.preventDefault(); const b = e.target.querySelector('button'); act(b, async () => {
    const v = Object.fromEntries(new FormData(e.target));
    const r = await api('/api/admin/members', v);
    showCreds(r.member, r.password, `${r.member.name} added`);
  }); };
}

render();
setInterval(() => { if (!document.hidden && !document.querySelector('.modal') && !document.querySelector('.gate') && !document.activeElement?.matches('input')) render(); }, 30000);
</script>
</body>
</html>
